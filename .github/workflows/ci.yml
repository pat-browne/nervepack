name: CI

on:
  push:
  pull_request:
  workflow_dispatch:        # ad-hoc manual runs from the Actions UI

jobs:
  syntax:
    name: Syntax sweep (stdlib-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Python syntax (py_compile)
        run: |
          files=$(git ls-files '*.py')
          echo "Checking $(echo "$files" | grep -c . ) Python file(s)"
          echo "$files" | xargs -r python3 -m py_compile

      - name: Bash syntax (bash -n)
        run: |
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      # F4/#250: every gate emits a structured verdict the summary job collects
      # into one PR comment. github.sha/run_id/server_url/repository are all
      # GitHub-computed, never PR-author-controlled, so direct ${{ }}
      # interpolation here is safe (contrast head_ref/base_ref below).
      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "syntax" --status "${{ job.status }}" --reason "Python/bash syntax sweep" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-syntax.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-syntax
          path: gate-verdict-syntax.json

  regression:
    name: Regression suite (zero-dep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # The runner discovers every test_*.sh / test_*.py under engine/setup/tests/
      # (excluding the e2e suite, which needs a browser — see the dashboard-e2e job),
      # runs each hermetically, and writes a functionality-grouped Markdown report.
      - name: Run regression suite
        run: bash engine/setup/tests/run-all.sh --report regression-report.md

      # See the Windows job's identical step: run-all.sh only echoes a test's
      # captured stdout on FAILURE, so test_pid_alive_diag.sh's timestamped
      # markers (written straight to this file, not through stdout) would
      # otherwise never surface here even when this job's own log shows a FAIL.
      # $GITHUB_STEP_SUMMARY only renders in the web UI's Summary tab -- it is
      # NOT part of the step log stream, so `gh run view --log` / `gh api
      # .../logs` can never retrieve it. Echo to stdout too so this evidence
      # is retrievable the same way every other test line in this job is.
      - name: Publish pid diagnostic evidence
        if: always()
        run: |
          if [[ -f .ci-debug-pid-diag.log ]]; then
            echo "=== PID liveness diagnostic evidence ==="
            cat .ci-debug-pid-diag.log
            echo "=== end PID liveness diagnostic evidence ==="
            {
              echo "## PID liveness diagnostic evidence"
              echo '```'
              cat .ci-debug-pid-diag.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish report to job summary
        if: always()
        run: cat regression-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: regression-report.md

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "regression" --status "${{ job.status }}" --reason "Zero-dependency regression suite" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-regression.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-regression
          path: gate-verdict-regression.json

  dashboard-e2e:
    name: Dashboard e2e (Playwright, informational)
    runs-on: ubuntu-latest
    continue-on-error: true        # informational — never blocks merge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Pin to 3.12: playwright 1.48.0 pins greenlet 3.1.1, which has no wheel for
          # the very newest CPython (3.14) and fails to build from source in CI. The
          # zero-dep `regression` job stays on "3.x".
          python-version: "3.12"

      - name: Install Playwright + chromium
        run: |
          pip install -r engine/setup/tests/e2e/requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Run e2e
        working-directory: engine/setup/tests/e2e
        run: python3 -m unittest test_implement_flow -v 2>&1 | tee "$GITHUB_WORKSPACE/e2e-report.txt"

      - name: Publish e2e to job summary
        if: always()
        run: |
          {
            echo "## Dashboard e2e"
            echo '```'
            cat e2e-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e-report.txt

  windows:
    name: Windows suite (Git-bash)
    runs-on: windows-latest        # required gate — the suite is green end-to-end under Git-bash
    defaults:
      run:
        shell: bash                # the Git-for-Windows bash on the runner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The runner discovers `.py` tests and invokes them as `python3`, which the
      # Windows Python install exposes only as `python`. Shim it onto PATH so the
      # same runner works unmodified. GITHUB_PATH persists the (absolute) dir across
      # the suite even after each test reassigns $HOME for its hermetic sandbox.
      - name: Shim python3 -> python
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$HOME/bin/python3"
            chmod +x "$HOME/bin/python3"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      # MSYS=winsymlinks:nativestrict makes Git-bash `ln -s` create real NTFS symlinks
      # (the runner is elevated), so the skill-link tests' `test -L`/`readlink` behave
      # as on Linux. jq is preinstalled on the windows-latest image.
      - name: Run regression suite
        env:
          MSYS: winsymlinks:nativestrict
        run: bash engine/setup/tests/run-all.sh --report regression-report-win.md

      # run-all.sh only echoes a test's captured stdout when it FAILS, so
      # test_pid_alive_diag.sh's evidence (raw OpenProcess/GetLastError, ps
      # WINPID cross-check) never reaches the log on a PASS -- it mirrors its
      # own output to this fixed path specifically so it's visible either way.
      # $GITHUB_STEP_SUMMARY only renders in the web UI's Summary tab -- it is
      # NOT part of the step log stream, so `gh run view --log` / `gh api
      # .../logs` can never retrieve it. Echo to stdout too so this evidence
      # is retrievable the same way every other test line in this job is.
      - name: Publish pid diagnostic evidence
        if: always()
        run: |
          if [[ -f .ci-debug-pid-diag.log ]]; then
            echo "=== PID liveness diagnostic evidence ==="
            cat .ci-debug-pid-diag.log
            echo "=== end PID liveness diagnostic evidence ==="
            {
              echo "## PID liveness diagnostic evidence"
              echo '```'
              cat .ci-debug-pid-diag.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish report to job summary
        if: always()
        run: cat regression-report-win.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-windows
          path: regression-report-win.md

      # python3 already resolves here via the shim step above (persisted onto
      # $GITHUB_PATH for the rest of this job).
      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "windows" --status "${{ job.status }}" --reason "Regression suite under Git-bash" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-windows.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-windows
          path: gate-verdict-windows.json

  windows-bashfree:
    name: Bash-free MCP suite (no Git-bash)
    runs-on: windows-latest
    # Required gate (git-for-windows-free MCP milestone, #38, complete). Proves the
    # ported MCP surface — protocol + resources + prompts, gating, content resolution,
    # recall, doctor(core), toggle(status+local), sync, capture, evaluate — works with
    # Git for Windows absent. The two tools that still need bash (flush/maintain) are
    # out of scope and refuse cleanly; see tests/mcp/test_bashfree.py.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run the bash-free MCP test with Git-bash removed from PATH
        shell: pwsh
        env:
          NP_MCP_PURE_PYTHON: "1"
        run: |
          # Remove the Git-bash dirs (Git\bin, Git\usr\bin — both ship bash.exe/sh)
          # from PATH for this step, the real-world "no Git-bash" condition — but KEEP
          # git.exe (Git\cmd, Git\mingw64\bin) and Python, since the spec's bash-free
          # host still has native git. The test also pins a bogus NP_BASH so any
          # accidental shell-out fails loudly rather than finding some other bash.
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -notmatch '\\Git\\bin' -and $_ -notmatch '\\Git\\usr' }) -join ';'
          $bash = (Get-Command bash -ErrorAction SilentlyContinue).Source
          Write-Host "Git-bash removed from PATH; 'bash' now resolves to: $bash"
          git --version          # native git must survive (doctor's git-sync check)
          python --version
          python engine/setup/tests/mcp/test_bashfree.py -v

      # No shell: pwsh here (unlike the step above) - this job has no bash
      # default, and only bare `python` is proven to resolve in it (the step
      # above never installs a python3 alias).
      - name: Emit structured gate verdict
        if: always()
        run: python engine/setup/np-gate-verdict.py --gate "windows-bashfree" --status "${{ job.status }}" --reason "Bash-free MCP suite" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-windows-bashfree.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-windows-bashfree
          path: gate-verdict-windows-bashfree.json

  pii-guard:
    name: Secret/PII guard (terminal gate)
    runs-on: ubuntu-latest
    needs: [syntax, regression]    # terminal gate — runs only after the blocking jobs pass
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Fail the build if any non-allowlisted secret/PII lands in a committed
      # engine file. Personal content lives in a separate overlay repo, so the
      # engine tree is the publishable surface and must stay clean. The scanner
      # is pure stdlib and takes only the checked-out path — no untrusted input.
      - name: Scan engine tree for secrets/PII
        run: python3 publish/np-publish-scan.py "$GITHUB_WORKSPACE"

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "pii-guard" --status "${{ job.status }}" --reason "Secret/PII scan of the engine tree" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-pii-guard.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-pii-guard
          path: gate-verdict-pii-guard.json

  spec-guard:
    name: Spec guard (change-specs, advisory)
    runs-on: ubuntu-latest
    # A normal job-level `if:` on event type — NOT the workflow-level `paths:`
    # filter that silently strands required checks (see np-spec-guard.py's own
    # "no base ref" exit-0 path for the same reasoning, belt and suspenders).
    if: github.event_name == 'pull_request'
    # Advisory (#248/F2): reports a real pass/fail, but never blocks merge
    # while this stays out of the required-checks ruleset. Promote by adding
    # "Spec guard" to the ruleset after a watch period — see
    # change-specs/README.md — not by removing this line first.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need base-branch history for the three-dot diff

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check for a change-specs/ record covering this diff
        # github.head_ref (and, more weakly, base_ref) are attacker-controlled
        # PR-derived strings - pass via env and reference as shell variables,
        # never interpolate ${{ }} directly into the run: script.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 engine/setup/np-spec-guard.py \
            --root "$GITHUB_WORKSPACE" \
            --base "origin/$BASE_REF" \
            --head HEAD \
            --branch "$HEAD_REF"

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "spec-guard" --status "${{ job.status }}" --reason "change-specs/ coverage check (advisory)" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-spec-guard.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-spec-guard
          path: gate-verdict-spec-guard.json

  diff-review:
    name: Diff review (multi-lens, advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Advisory (#252/F6): posts PR comments, never approves, never requests
    # changes, never blocks - see np-diff-review.py's own docstring for the
    # measured evidence behind this. continue-on-error is almost decorative
    # here (the script itself always exits 0), kept for consistency with the
    # other advisory jobs and as a second guard if that ever changes.
    continue-on-error: true
    permissions:
      pull-requests: write   # to post the review
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # np-diff-review.py probes for an executable claude CLI before it
      # consults any credential, and ubuntu-latest does not ship one - so
      # without this step the job reported SKIPPED unconditionally, secret or
      # no secret (#252 shipped believing a secret alone would activate it).
      # Pinned, not floating: a moving version would change the reviewer's
      # behavior between two runs of the same PR, which is exactly what F4's
      # rules_sha pinning exists to prevent. Installed from npm rather than
      # `curl | bash` because this is the one job that holds a real credential.
      - name: Install the claude CLI (pinned)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.236
          echo "CLAUDE_BIN=$(command -v claude)" >> "$GITHUB_ENV"

      - name: Run the multi-lens diff review
        # github.head_ref is attacker-controlled - env + shell variable, never
        # ${{ }} interpolated directly into the run: script (same reasoning
        # as spec-guard's step above).
        #
        # CLAUDE_CODE_OAUTH_TOKEN is absent on fork PRs - GitHub withholds
        # secrets from them - so the reviewer skips there and the PR still goes
        # green. The fail-open path is also the fork-safety path.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 engine/setup/np-diff-review.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --branch "$HEAD_REF" \
            --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --rules-sha "${{ github.sha }}" \
            --out gate-verdict-diff-review.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-diff-review
          path: gate-verdict-diff-review.json

  gate-verdicts-summary:
    name: Gate verdicts summary
    runs-on: ubuntu-latest
    # always(): this must still post when an upstream gate failed - that's
    # the whole point (F4/#250). needs' default gating would otherwise skip
    # this job the moment any one of them fails or is skipped.
    if: always() && github.event_name == 'pull_request'
    needs: [syntax, regression, windows, windows-bashfree, pii-guard, spec-guard, diff-review]
    permissions:
      pull-requests: write   # to post/update the summary comment
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Download every gate-verdict-* artifact
        uses: actions/download-artifact@v7
        with:
          pattern: gate-verdict-*
          path: verdicts
          merge-multiple: true

      - name: Post or update the gate-verdicts PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 engine/setup/np-gate-verdicts-comment.py --verdicts-dir verdicts --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
