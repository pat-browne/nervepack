name: CI

on:
  push:
  pull_request:
  workflow_dispatch:        # ad-hoc manual runs from the Actions UI

# Least privilege for every job that does not say otherwise (#255/F9). Without
# this the whole workflow ran with the repository default, which on a repo
# configured for write is a token that can push to main sitting in a job that
# only ever needed to read the tree. The three jobs that genuinely need more
# declare their own `permissions:` block, and a job-level block REPLACES this
# one rather than adding to it - so each of them restates `contents: read`.
#
# Note `pull_request` (never `pull_request_target`): a fork's token is read-only
# regardless of what is written here, so the fork case fails closed with no
# conditional to get wrong.
permissions:
  contents: read

jobs:
  syntax:
    name: Syntax sweep (stdlib-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Python syntax (py_compile)
        run: |
          files=$(git ls-files '*.py')
          echo "Checking $(echo "$files" | grep -c . ) Python file(s)"
          echo "$files" | xargs -r python3 -m py_compile

      - name: Bash syntax (bash -n)
        run: |
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      # F4/#250: every gate emits a structured verdict the summary job collects
      # into one PR comment. github.sha/run_id/server_url/repository are all
      # GitHub-computed, never PR-author-controlled, so direct ${{ }}
      # interpolation here is safe (contrast head_ref/base_ref below).
      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "syntax" --status "${{ job.status }}" --reason "Python/bash syntax sweep" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-syntax.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-syntax
          path: gate-verdict-syntax.json

  regression:
    name: Regression suite (zero-dep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # The runner discovers every test_*.sh / test_*.py under engine/setup/tests/
      # (excluding the e2e suite, which needs a browser — see the dashboard-e2e job),
      # runs each hermetically, and writes a functionality-grouped Markdown report.
      - name: Run regression suite
        run: bash engine/setup/tests/run-all.sh --report regression-report.md

      # See the Windows job's identical step: run-all.sh only echoes a test's
      # captured stdout on FAILURE, so test_pid_alive_diag.sh's timestamped
      # markers (written straight to this file, not through stdout) would
      # otherwise never surface here even when this job's own log shows a FAIL.
      # $GITHUB_STEP_SUMMARY only renders in the web UI's Summary tab -- it is
      # NOT part of the step log stream, so `gh run view --log` / `gh api
      # .../logs` can never retrieve it. Echo to stdout too so this evidence
      # is retrievable the same way every other test line in this job is.
      - name: Publish pid diagnostic evidence
        if: always()
        run: |
          if [[ -f .ci-debug-pid-diag.log ]]; then
            echo "=== PID liveness diagnostic evidence ==="
            cat .ci-debug-pid-diag.log
            echo "=== end PID liveness diagnostic evidence ==="
            {
              echo "## PID liveness diagnostic evidence"
              echo '```'
              cat .ci-debug-pid-diag.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish report to job summary
        if: always()
        run: cat regression-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: regression-report.md

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "regression" --status "${{ job.status }}" --reason "Zero-dependency regression suite" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-regression.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-regression
          path: gate-verdict-regression.json

  dashboard-e2e:
    name: Dashboard e2e (Playwright, informational)
    runs-on: ubuntu-latest
    continue-on-error: true        # informational — never blocks merge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Pin to 3.12: playwright 1.48.0 pins greenlet 3.1.1, which has no wheel for
          # the very newest CPython (3.14) and fails to build from source in CI. The
          # zero-dep `regression` job stays on "3.x".
          python-version: "3.12"

      - name: Install Playwright + chromium
        run: |
          pip install -r engine/setup/tests/e2e/requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Run e2e
        working-directory: engine/setup/tests/e2e
        run: python3 -m unittest test_implement_flow -v 2>&1 | tee "$GITHUB_WORKSPACE/e2e-report.txt"

      - name: Publish e2e to job summary
        if: always()
        run: |
          {
            echo "## Dashboard e2e"
            echo '```'
            cat e2e-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e-report.txt

  windows:
    name: Windows suite (Git-bash)
    runs-on: windows-latest        # required gate — the suite is green end-to-end under Git-bash
    defaults:
      run:
        shell: bash                # the Git-for-Windows bash on the runner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The runner discovers `.py` tests and invokes them as `python3`, which the
      # Windows Python install exposes only as `python`. Shim it onto PATH so the
      # same runner works unmodified. GITHUB_PATH persists the (absolute) dir across
      # the suite even after each test reassigns $HOME for its hermetic sandbox.
      - name: Shim python3 -> python
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$HOME/bin/python3"
            chmod +x "$HOME/bin/python3"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      # MSYS=winsymlinks:nativestrict makes Git-bash `ln -s` create real NTFS symlinks
      # (the runner is elevated), so the skill-link tests' `test -L`/`readlink` behave
      # as on Linux. jq is preinstalled on the windows-latest image.
      - name: Run regression suite
        env:
          MSYS: winsymlinks:nativestrict
        run: bash engine/setup/tests/run-all.sh --report regression-report-win.md

      # run-all.sh only echoes a test's captured stdout when it FAILS, so
      # test_pid_alive_diag.sh's evidence (raw OpenProcess/GetLastError, ps
      # WINPID cross-check) never reaches the log on a PASS -- it mirrors its
      # own output to this fixed path specifically so it's visible either way.
      # $GITHUB_STEP_SUMMARY only renders in the web UI's Summary tab -- it is
      # NOT part of the step log stream, so `gh run view --log` / `gh api
      # .../logs` can never retrieve it. Echo to stdout too so this evidence
      # is retrievable the same way every other test line in this job is.
      - name: Publish pid diagnostic evidence
        if: always()
        run: |
          if [[ -f .ci-debug-pid-diag.log ]]; then
            echo "=== PID liveness diagnostic evidence ==="
            cat .ci-debug-pid-diag.log
            echo "=== end PID liveness diagnostic evidence ==="
            {
              echo "## PID liveness diagnostic evidence"
              echo '```'
              cat .ci-debug-pid-diag.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish report to job summary
        if: always()
        run: cat regression-report-win.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-windows
          path: regression-report-win.md

      # python3 already resolves here via the shim step above (persisted onto
      # $GITHUB_PATH for the rest of this job).
      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "windows" --status "${{ job.status }}" --reason "Regression suite under Git-bash" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-windows.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-windows
          path: gate-verdict-windows.json

  windows-bashfree:
    name: Bash-free MCP suite (no Git-bash)
    runs-on: windows-latest
    # Required gate (git-for-windows-free MCP milestone, #38, complete). Proves the
    # ported MCP surface — protocol + resources + prompts, gating, content resolution,
    # recall, doctor(core), toggle(status+local), sync, capture, evaluate — works with
    # Git for Windows absent. The two tools that still need bash (flush/maintain) are
    # out of scope and refuse cleanly; see tests/mcp/test_bashfree.py.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run the bash-free MCP test with Git-bash removed from PATH
        shell: pwsh
        env:
          NP_MCP_PURE_PYTHON: "1"
        run: |
          # Remove the Git-bash dirs (Git\bin, Git\usr\bin — both ship bash.exe/sh)
          # from PATH for this step, the real-world "no Git-bash" condition — but KEEP
          # git.exe (Git\cmd, Git\mingw64\bin) and Python, since the spec's bash-free
          # host still has native git. The test also pins a bogus NP_BASH so any
          # accidental shell-out fails loudly rather than finding some other bash.
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -notmatch '\\Git\\bin' -and $_ -notmatch '\\Git\\usr' }) -join ';'
          $bash = (Get-Command bash -ErrorAction SilentlyContinue).Source
          Write-Host "Git-bash removed from PATH; 'bash' now resolves to: $bash"
          git --version          # native git must survive (doctor's git-sync check)
          python --version
          python engine/setup/tests/mcp/test_bashfree.py -v

      # No shell: pwsh here (unlike the step above) - this job has no bash
      # default, and only bare `python` is proven to resolve in it (the step
      # above never installs a python3 alias).
      - name: Emit structured gate verdict
        if: always()
        run: python engine/setup/np-gate-verdict.py --gate "windows-bashfree" --status "${{ job.status }}" --reason "Bash-free MCP suite" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-windows-bashfree.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-windows-bashfree
          path: gate-verdict-windows-bashfree.json

  pii-guard:
    name: Secret/PII guard (terminal gate)
    runs-on: ubuntu-latest
    needs: [syntax, regression]    # terminal gate — runs only after the blocking jobs pass
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Fail the build if any non-allowlisted secret/PII lands in a committed
      # engine file. Personal content lives in a separate overlay repo, so the
      # engine tree is the publishable surface and must stay clean. The scanner
      # is pure stdlib and takes only the checked-out path — no untrusted input.
      - name: Scan engine tree for secrets/PII
        run: python3 publish/np-publish-scan.py "$GITHUB_WORKSPACE"

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "pii-guard" --status "${{ job.status }}" --reason "Secret/PII scan of the engine tree" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-pii-guard.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-pii-guard
          path: gate-verdict-pii-guard.json

  spec-guard:
    name: Spec guard (change-specs)
    runs-on: ubuntu-latest
    # A normal job-level `if:` on event type — NOT the workflow-level `paths:`
    # filter that silently strands required checks (see np-spec-guard.py's own
    # "no base ref" exit-0 path for the same reasoning, belt and suspenders).
    if: github.event_name == 'pull_request'
    # PROMOTED to required (#254/F8). It shipped advisory in #248/F2 and has
    # run on every pull request since without a false positive, which is the
    # watch period change-specs/README.md asked for. Its context now sits in
    # the branch ruleset (.github/branch-protection/ruleset-main.json), so
    # continue-on-error is gone: with it set the job reports success even when
    # the script exits 1, which would make the required check vacuous.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need base-branch history for the three-dot diff

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check for a change-specs/ record covering this diff
        # github.head_ref (and, more weakly, base_ref) are attacker-controlled
        # PR-derived strings - pass via env and reference as shell variables,
        # never interpolate ${{ }} directly into the run: script.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 engine/setup/np-spec-guard.py \
            --root "$GITHUB_WORKSPACE" \
            --base "origin/$BASE_REF" \
            --head HEAD \
            --branch "$HEAD_REF"

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "spec-guard" --status "${{ job.status }}" --reason "change-specs/ coverage check" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-spec-guard.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-spec-guard
          path: gate-verdict-spec-guard.json

  diff-review:
    name: Diff review (multi-lens, advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Advisory (#252/F6): posts PR comments, never approves, never requests
    # changes, never blocks - see np-diff-review.py's own docstring for the
    # measured evidence behind this. continue-on-error is almost decorative
    # here (the script itself always exits 0), kept for consistency with the
    # other advisory jobs and as a second guard if that ever changes.
    continue-on-error: true
    permissions:
      pull-requests: write   # to post the review
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # np-diff-review.py probes for an executable claude CLI before it
      # consults any credential, and ubuntu-latest does not ship one - so
      # without this step the job reported SKIPPED unconditionally, secret or
      # no secret (#252 shipped believing a secret alone would activate it).
      # Pinned, not floating: a moving version would change the reviewer's
      # behavior between two runs of the same PR, which is exactly what F4's
      # rules_sha pinning exists to prevent. Installed from npm rather than
      # `curl | bash` because this is the one job that holds a real credential.
      - name: Install the claude CLI (pinned)
        run: |
          # A `run:` step gets `bash -e`, so a failed npm install aborts the step
          # and turns the job red - for a registry outage or a yanked version,
          # neither of which says anything about the diff. An advisory gate must
          # not do that. Swallow it, warn, and let the review step skip cleanly:
          # CLAUDE_BIN stays unset, model_available() falls back to a path that
          # does not exist, and the verdict is SKIPPED.
          npm install -g @anthropic-ai/claude-code@2.1.236 || {
            echo "::warning::npm install of the claude CLI failed - the diff review will SKIP"
            exit 0
          }
          # Export CLAUDE_BIN only when the CLI is actually on PATH. Setting it
          # empty is harmless - model_available()'s `or` falls back to
          # ~/.local/bin/claude and the review skips cleanly - but the verdict
          # would then read "no claude CLI configured" for a run where the
          # install SUCCEEDED. A wrong reason costs more debugging time than no
          # reason, so say so loudly here instead. Advisory gate: warn and let
          # it skip, never fail the step and turn the PR red.
          bin=$(command -v claude || true)
          if [ -z "$bin" ]; then
            echo "::warning::the claude CLI is not on PATH after install - the diff"
            echo "::warning::review will SKIP, and its reason will understate why."
          else
            echo "CLAUDE_BIN=$bin" >> "$GITHUB_ENV"
          fi

      - name: Run the multi-lens diff review
        # github.head_ref is attacker-controlled - env + shell variable, never
        # ${{ }} interpolated directly into the run: script (same reasoning
        # as spec-guard's step above).
        #
        # CLAUDE_CODE_OAUTH_TOKEN is absent on fork PRs - GitHub withholds
        # secrets from them - so the reviewer skips there and the PR still goes
        # green. The fail-open path is also the fork-safety path.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 engine/setup/np-diff-review.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --branch "$HEAD_REF" \
            --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --rules-sha "${{ github.sha }}" \
            --out gate-verdict-diff-review.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-diff-review
          path: gate-verdict-diff-review.json

  tier-gate:
    name: Tier gate (differential gating)
    runs-on: ubuntu-latest
    # always(): this must run even when an upstream gate FAILED. Reading "which
    # required verdicts are missing" is the whole job - needs' default gating
    # would skip it exactly when it has the most to say.
    if: always() && github.event_name == 'pull_request'
    needs: [syntax, regression, windows, windows-bashfree, pii-guard, spec-guard, diff-review]
    # PROMOTED to required (#255/F9), which change spec 0010 named as this
    # issue's first step. It shipped advisory in #254/F8 and reported correctly
    # on every pull request since. `continue-on-error` is gone: with it set the
    # job reports success even when the script exits 1, which would make the
    # required check vacuous - and auto-merge is about to trust this verdict.
    #
    # Consequence worth knowing: a high-tier pull request whose `diff-review`
    # SKIPPED can no longer merge without an admin bypass, and `diff-review`
    # always skips on a fork. See change-specs/feat-f9-automerge.md.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need base-branch history for the three-dot diff

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Download every gate-verdict-* artifact
        uses: actions/download-artifact@v7
        with:
          pattern: gate-verdict-*
          path: verdicts
          merge-multiple: true

      - name: Apply the tier's requirement set
        # head_ref/base_ref are attacker-controlled PR-derived strings - passed
        # via env and referenced as shell variables, never ${{ }}-interpolated
        # into the run: script. Same reasoning as spec-guard above.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 engine/setup/np-tier-gate.py \
            --root "$GITHUB_WORKSPACE" \
            --base "origin/$BASE_REF" \
            --head HEAD \
            --branch "$HEAD_REF" \
            --verdicts-dir verdicts \
            --out tier-policy.json

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "tier-gate" --status "${{ job.status }}" --reason "Tier requirement set applied to this diff" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-tier-gate.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-tier-gate
          path: gate-verdict-tier-gate.json

      # A SEPARATE artifact, deliberately: gate-verdicts-summary downloads
      # `gate-verdict-*` with merge-multiple and then reads every *.json in the
      # merged directory as a verdict. Shipping tier-policy.json inside the
      # gate-verdict-* artifact would put a file with no `gate` field into that
      # set and render a blank row in the PR comment.
      #
      # Uploaded whether the gate passed or failed. #255 reads this to decide
      # auto-merge, and a policy artifact that exists only on success cannot be
      # watched during an advisory period.
      - name: Upload the tier policy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier-policy
          path: tier-policy.json

  doc-coupling:
    name: Doc coupling (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need base-branch history for the three-dot diff

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check that documentation moved with the change
        # Advisory permanently, not pending promotion. A blocking documentation
        # gate gets overridden by whoever holds the admin bit and then removed -
        # GitLab needed a three-day escape hatch on theirs, and Danger's
        # canonical example ships a #trivial bypass. The consequence here is an
        # issue opened at MERGE (see doc-coupling-issue below), which has to be
        # closed by someone rather than dismissed.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 engine/setup/np-doc-coupling-gate.py \
            --root "$GITHUB_WORKSPACE" \
            --base "origin/$BASE_REF" \
            --head HEAD \
            --out doc-coupling.json

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "doc-coupling" --status "${{ job.status }}" --reason "Documentation-coupling check (advisory)" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-doc-coupling.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-doc-coupling
          path: gate-verdict-doc-coupling.json

  doc-coupling-issue:
    name: Doc coupling (record the debt)
    runs-on: ubuntu-latest
    # Merge time only. Opening an issue from a pull-request job would file one
    # on every push to the branch, and would hand `issues: write` to a job
    # running on pull-request-derived input. By the time a commit is on main it
    # is a fact, and there is exactly one of it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # the merge commit and its parent

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Open an issue for any unmet coupling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 engine/setup/np-doc-coupling-gate.py \
            --root "$GITHUB_WORKSPACE" \
            --head HEAD \
            --open-issue \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  auto-merge:
    name: Auto-merge decision (standard tier)
    runs-on: ubuntu-latest
    # always(): a decision is recorded on EVERY pull request, including one
    # where tier-gate failed. A record that exists only when the mechanism fires
    # cannot be audited for the case that matters - the one where it fired and
    # should not have.
    if: always() && github.event_name == 'pull_request'
    needs: [tier-gate]
    permissions:
      # `gh pr merge --auto` needs BOTH. This is the scope GitHub's own
      # "Automating Dependabot with GitHub Actions" example declares for exactly
      # this call, and guessing lower fails in the worst possible way: the enable
      # step errors, the pull request simply never auto-merges, and nothing about
      # that looks different from "not eligible".
      #
      # `contents: write` here cannot push to `main`. The branch ruleset requires
      # a pull request, forbids non-fast-forward and deletion, and GITHUB_TOKEN
      # is not in its bypass-actor list - so the ruleset, not the token scope, is
      # what stands between this job and the default branch.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Download the tier policy
        # Tolerant on purpose: download-artifact errors hard when the artifact is
        # absent, and this job now runs even when tier-gate died before its
        # upload. A missing policy is not a crash here - np_automerge reads it as
        # "nothing is known about what this pull request touched", which blocks.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: tier-policy

      - name: Decide
        id: decide
        # PR_AUTHOR is github.event.pull_request.user.login - the pull request's
        # AUTHOR. Never github.actor, which is the last identity to ACT on the
        # pull request: an attacker who can cause any bot activity on a pull
        # request they control flips that context and inherits this path. It is
        # a login string from an untrusted source, so it goes through env and is
        # read as a shell variable, never ${{ }}-interpolated into the script.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 engine/setup/np-automerge-gate.py \
            --tier-policy tier-policy.json \
            --author "$PR_AUTHOR" \
            --out automerge-decision.json

      # Native auto-merge, never a merge API call. GitHub holds the pull request
      # until every required check and ruleset requirement is satisfied, then
      # merges - a WAITING mechanism, on the same side of the gate as a human
      # clicking the button. A step that merged directly would hold a token able
      # to merge whether or not the gates passed.
      - name: Enable native auto-merge
        if: steps.decide.outputs.will_enable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh prints its own specific error, so this adds only what gh cannot
          # know: what the failure means for this pull request. Without that
          # line, a red step next to a decision record saying will_enable=true
          # reads as "it merged something it should not have".
          gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --repo "${{ github.repository }}" || {
            echo "::error::could not enable auto-merge (see the gh error above)."
            echo "::error::The pull request is UNCHANGED - nothing merged, and nothing"
            echo "::error::will merge unattended. It now needs a human to merge it."
            exit 1
          }

      - name: Emit structured gate verdict
        if: always()
        run: python3 engine/setup/np-gate-verdict.py --gate "auto-merge" --status "${{ job.status }}" --reason "Auto-merge decision recorded (will_enable=${{ steps.decide.outputs.will_enable }})" --evidence-ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --rules-sha "${{ github.sha }}" --out gate-verdict-auto-merge.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict-auto-merge
          path: gate-verdict-auto-merge.json

      # Separate artifact, same reasoning as tier-policy: the summary job reads
      # every *.json in the merged gate-verdict-* directory as a verdict, and
      # this file has no `gate` field.
      - name: Upload the decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automerge-decision
          path: automerge-decision.json

  gate-verdicts-summary:
    name: Gate verdicts summary
    runs-on: ubuntu-latest
    # always(): this must still post when an upstream gate failed - that's
    # the whole point (F4/#250). needs' default gating would otherwise skip
    # this job the moment any one of them fails or is skipped.
    if: always() && github.event_name == 'pull_request'
    needs: [syntax, regression, windows, windows-bashfree, pii-guard, spec-guard, diff-review, tier-gate, auto-merge, doc-coupling]
    permissions:
      pull-requests: write   # to post/update the summary comment
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Download every gate-verdict-* artifact
        uses: actions/download-artifact@v7
        with:
          pattern: gate-verdict-*
          path: verdicts
          merge-multiple: true

      - name: Post or update the gate-verdicts PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 engine/setup/np-gate-verdicts-comment.py --verdicts-dir verdicts --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
