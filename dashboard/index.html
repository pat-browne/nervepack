<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nervepack · Performance</title>
<style>
  :root {
    --bg:#fbfaf8; --surface:#fff; --surface-alt:#f5f3ef; --border:#e8e5df;
    --text:#181614; --text-secondary:#5e5b56; --text-tertiary:#9b9892;
    --radius-sm:6px; --radius-md:9px; --radius-lg:12px;
    --shadow:0 4px 16px rgba(0,0,0,.06);
    /* Semantic status scale (AAA ~7:1 on --bg) */
    --status-pos:#3a5a43; --status-warn:#6f5829; --status-neg:#8c3a2d;
    --status-pos-bg:#eaf1ec; --status-warn-bg:#f1ead9; --status-neg-bg:#f3e3df;
    /* Data-viz palette */
    --viz-line:#3a5a43; --viz-fill:#eaf1ec; --viz-grid:#e8e5df; --viz-muted:#857f78;
    --accent-sage:#476b51;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:Inter,system-ui,-apple-system,sans-serif; font-size:15px;
         line-height:1.55; padding:28px; max-width:1340px; margin:0 auto; }

  /* Shell: wiki sidebar (left) + dashboard content (right). On narrow viewports
     the sidebar stacks above the content. */
  .shell { display:flex; gap:20px; align-items:flex-start; }
  .content { flex:1; min-width:0; max-width:1080px; }
  .wikinav { flex:0 0 260px; position:sticky; top:28px; align-self:flex-start;
             max-height:calc(100vh - 56px); display:flex; flex-direction:column;
             background:var(--surface); border:1px solid var(--border);
             border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:14px; }
  @media (max-width:900px) {
    .shell { flex-direction:column; }
    .wikinav { position:static; flex-basis:auto; width:100%; max-height:none; }
    .content { max-width:none; }
  }
  .wikinav .lbl { display:block; margin-bottom:8px; }
  .wikisearch { width:100%; font:inherit; font-size:13px; padding:7px 10px;
                border:1px solid var(--border); border-radius:var(--radius-sm);
                background:var(--surface-alt); color:var(--text); margin-bottom:10px; }
  .wikisearch:focus-visible { outline:2px solid var(--accent-sage); outline-offset:1px; }
  .wikilist { overflow-y:auto; flex:1; margin:0 -4px; padding:0 4px; }
  .wikicount { font-size:11px; color:var(--text-tertiary); margin-bottom:8px; }
  .wikiitem { display:block; padding:8px 8px; border-radius:var(--radius-sm);
              text-decoration:none; color:inherit; border-top:1px solid var(--border); }
  .wikilist .wikiitem:first-child { border-top:none; }
  .wikiitem:hover { background:var(--surface-alt); }
  .wikiitem:focus-visible { outline:2px solid var(--accent-sage); outline-offset:-2px; }
  .wikiitem .wn { font-size:13px; font-weight:600; color:var(--text); display:flex;
                  align-items:baseline; justify-content:space-between; gap:6px; }
  /* margin-left:auto absorbs the row's free space so the kind + layer pills cluster
     at the right edge instead of space-between spreading them across the row. */
  .wikiitem .wk { font-size:9px; text-transform:uppercase; letter-spacing:.04em;
                  color:var(--text-tertiary); font-weight:600; flex:0 0 auto;
                  margin-left:auto; }
  /* Content-layer badge ("personal" / a team overlay's dir basename). Deliberately
     subordinate to .wk so the page kind stays the primary signal; the pill shape
     distinguishes provenance from kind at a glance. */
  .wikiitem .wl { font-size:9px; color:var(--text-tertiary); font-weight:500;
                  flex:0 1 auto; min-width:0; max-width:14ch; overflow:hidden;
                  text-overflow:ellipsis; white-space:nowrap;
                  background:var(--surface-alt); border:1px solid var(--border);
                  border-radius:var(--radius-sm); padding:1px 5px; }
  .wikiitem .wx { font-size:11px; color:var(--text-secondary); margin-top:2px;
                  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
                  overflow:hidden; }
  .wikiitem .wd { font-size:10px; color:var(--text-tertiary); margin-top:3px; }
  .wikigroup { border:none; margin:0 -4px; }
  .wikigroup > summary { list-style:none; cursor:pointer; padding:7px 8px;
    font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    color:var(--text-tertiary); display:flex; justify-content:space-between;
    border-radius:var(--radius-sm); }
  .wikigroup > summary::-webkit-details-marker { display:none; }
  .wikigroup > summary:hover { background:var(--surface-alt); }
  .wikigroup > summary::before { content:"\25BE"; margin-right:6px; font-size:9px; }
  .wikigroup:not([open]) > summary::before { content:"\25B8"; }
  /* Per-layer sections (only rendered when >1 content layer resolves). Styled a step
     stronger than .wikigroup so the layer reads as the outermost grouping. */
  .wikilayer { border:none; margin:0 -4px 4px; }
  .wikilayer > summary { list-style:none; cursor:pointer; padding:7px 8px;
    font-size:11px; font-weight:700; color:var(--text); display:flex;
    justify-content:space-between; gap:6px; border-radius:var(--radius-sm);
    background:var(--surface-alt); border:1px solid var(--border); }
  .wikilayer > summary::-webkit-details-marker { display:none; }
  .wikilayer > summary:hover { border-color:var(--accent-sage); }
  .wikilayer > summary::before { content:"\25BE"; margin-right:6px; font-size:9px;
    color:var(--text-tertiary); }
  .wikilayer:not([open]) > summary::before { content:"\25B8"; }
  /* The layer wrapper takes the -4px bleed into .wikilist's padding; inner groups
     must not also claim it or the extra nesting level overflows the sidebar. */
  .wikilayer > .wikinest { margin-left:0; }
  .wikilayer .wikigroup { margin-left:0; margin-right:0; }
  /* Inside a per-layer section the item badge just repeats the section header. */
  .wikilist.split .wikiitem .wl { display:none; }
  /* Overridden page: dimmed, with a marker. Still openable — the point is to make
     precedence legible, not to hide the shadowed copy. */
  .wikiitem.shadowed { opacity:.55; }
  .wikiitem .wsh { font-size:9px; text-transform:uppercase; letter-spacing:.04em;
                   color:var(--status-warn); font-weight:600; flex:0 0 auto; }
  .wikitopic { margin:2px 0 2px 10px; }
  .wikitopic > summary { list-style:none; cursor:pointer; padding:4px 8px;
    font-size:11px; font-weight:600; color:var(--text-secondary);
    border-radius:var(--radius-sm); }
  .wikitopic > summary::-webkit-details-marker { display:none; }
  .wikitopic > summary::before { content:"\25BE"; margin-right:6px; font-size:8px;
    color:var(--text-tertiary); }
  .wikitopic:not([open]) > summary::before { content:"\25B8"; }
  .wikinest { margin-left:6px; }
  h1 { font-size:20px; font-weight:600; margin:0; }
  .sub { color:var(--text-tertiary); font-size:12px; margin-top:2px; }
  .pagehead { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .btn-icon { font-size:16px; line-height:1; cursor:pointer; width:34px; height:34px; flex:0 0 auto;
              display:inline-flex; align-items:center; justify-content:center;
              border:1px solid var(--border); border-radius:var(--radius-sm);
              background:var(--surface); color:var(--text-secondary); }
  .btn-icon:hover { background:var(--surface-alt); color:var(--text); border-color:var(--accent-sage); }
  .btn-icon:focus-visible { outline:2px solid var(--accent-sage); outline-offset:2px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(24,22,20,.35);
                   display:flex; align-items:flex-start; justify-content:center;
                   padding:60px 20px; z-index:50; }
  .modal-overlay[hidden] { display:none; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
           box-shadow:var(--shadow); width:100%; max-width:760px;
           max-height:calc(100vh - 120px); overflow-y:auto; padding:16px; }
  .modalhead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  /* Overlay viewer: one sandboxed iframe for wiki pages and large panels. */
  .viewer-overlay { padding:24px; align-items:stretch; }
  .viewer { max-width:1100px; max-height:none; height:calc(100vh - 48px);
            display:flex; flex-direction:column; overflow:hidden; }
  .viewer iframe { flex:1 1 auto; width:100%; border:1px solid var(--border);
                   border-radius:var(--radius-sm); background:var(--surface); }
  a.btn { text-decoration:none; color:inherit; display:inline-flex; align-items:center; }
  .pager { display:flex; align-items:center; justify-content:flex-end; gap:8px;
           margin-top:8px; font-size:11px; color:var(--text-tertiary); }
  /* ?view=settings: the settings panel alone, as a page inside the viewer. */
  body.view-settings .shell { display:none; }
  body.view-settings #settings-overlay { position:static; background:none; padding:0; }
  body.view-settings #settings-overlay .modal { max-width:none; max-height:none;
                                                box-shadow:none; border:none; }
  body.view-settings #btn-settings-close { display:none; }
  .grid { display:grid; gap:16px; margin-top:18px; grid-template-columns:1fr 1fr; }
  /* Must come AFTER the base .grid rule — same specificity, so source order decides.
     Declared up in the top @media block it silently lost and the grid never stacked. */
  @media (max-width:900px) {
    .grid { grid-template-columns:1fr; }   /* stack the two-up panels on narrow/phone viewports */
  }
  .panel { background:var(--surface); border:1px solid var(--border);
           border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:16px; }
  .panel.full { grid-column:1 / -1; }
  .grid > .panel { min-width:0; }   /* let wide charts and tables shrink inside a two-up cell */
  .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.04em;
         color:var(--status-pos); font-weight:600; }
  .empty { color:var(--text-tertiary); font-size:13px; padding:18px 0; text-align:center; }
  .statstrip { display:flex; gap:18px; margin:8px 0 12px; flex-wrap:wrap; }
  .stat b { display:block; font-size:18px; color:var(--text); }
  .stat span { font-size:11px; color:var(--text-secondary); }
  /* Token card: five stats share one row, tighter gap so they fit a two-up cell */
  .statstrip.tokstrip { gap:8px 14px; }
  .tokstrip .stat span { white-space:nowrap; }

  /* Charts: wireChart() sets the viewBox to the wrapper's pixel size, so the scale
     is 1:1 and nothing stretches. In a two-up row the chart grows to fill the cell. */
  #panel-trend, #panel-tokens { display:flex; flex-direction:column; }
  /* Fixed plot height so both two-up charts match. margin-top:auto pins the chart and
     legend to the card bottom, so bottoms line up when the stat blocks differ. */
  .chartwrap { position:relative; width:100%; flex:none; height:180px; margin-top:auto; }
  .chart text.tick { fill:var(--text-tertiary); font-size:10px; }
  .chart { position:absolute; inset:0; display:block; overflow:visible; }
  .chart line.grid { stroke:var(--viz-grid); stroke-width:1; }
  .chart polyline { fill:none; stroke:var(--viz-line); stroke-width:2;
                    vector-effect:non-scaling-stroke; }
  .pt { position:absolute; width:8px; height:8px; border-radius:50%;
        background:var(--viz-line); transform:translate(-50%,-50%); opacity:.9;
        box-shadow:0 0 0 1px var(--surface); pointer-events:none; }
  .pt.on { opacity:1; width:11px; height:11px; box-shadow:0 0 0 2px var(--surface); }
  .pt:focus-visible { opacity:1; outline:2px solid var(--accent-sage); outline-offset:2px; }
  .tip { position:absolute; z-index:5; pointer-events:none; background:var(--surface);
         border:1px solid var(--border); border-radius:var(--radius-md);
         box-shadow:var(--shadow); padding:8px 10px; font-size:12px; min-width:130px;
         color:var(--text); }
  .tip .t-date { font-size:10px; text-transform:uppercase; letter-spacing:.04em;
                 color:var(--text-tertiary); margin-bottom:4px; }
  .tip .t-hd { font-weight:700; font-size:14px; margin-bottom:4px; }
  .tip .t-row { display:flex; justify-content:space-between; gap:16px; }
  .tip .t-row span:last-child { color:var(--text-secondary); }
  .legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:10px;
            font-size:11px; color:var(--text-secondary); align-items:center; }
  .legend .key { display:inline-flex; align-items:center; gap:6px; }
  .legend .sw { width:18px; height:3px; border-radius:2px; background:var(--viz-line); }
  .legend .sw.dot { width:9px; height:9px; border-radius:50%; }
  .legend .sw.grid { height:0; border-top:1px dashed var(--viz-grid); width:18px; }
  .legend .muted { color:var(--text-tertiary); }
  /* Hint on its own row in every legend, so legend height (and the chart bottom) match across a two-up row */
  .legend .hint { flex-basis:100%; text-align:right; color:var(--text-tertiary); }
  /* Expandable detail text on graduation and proposal rows */
  .txt.has-detail { cursor:pointer; }
  .detailtog { font:inherit; font-size:11px; color:var(--accent-sage); background:none;
               border:none; padding:0; margin-top:4px; cursor:pointer; }
  .detailtog:focus-visible { outline:2px solid var(--accent-sage); outline-offset:2px; }
  .detail { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; padding:8px 10px;
            font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--text);
            background:var(--surface-alt); border:1px solid var(--border);
            border-radius:var(--radius-sm); max-height:360px; overflow:auto; cursor:auto; }

  .sug { display:flex; align-items:flex-start; gap:12px; padding:10px 0;
         border-top:1px solid var(--border); flex-wrap:wrap; }
  .sug:first-child { border-top:none; }
  .sug .txt { flex:1 1 320px; min-width:0; font-size:13px; }
  .sug .meta { font-size:11px; color:var(--text-tertiary); margin-top:2px; }
  .sugedit { width:100%; font:inherit; font-size:13px; line-height:1.45; resize:vertical;
             color:var(--text); background:var(--surface); padding:6px 8px;
             border:1px solid var(--accent-sage); border-radius:var(--radius-sm); }
  .sugedit:focus-visible { outline:2px solid var(--accent-sage); outline-offset:1px; }
  .pill { display:inline-flex; align-items:center; gap:4px; font-size:11px;
          font-weight:600; padding:2px 8px; border-radius:var(--radius-sm);
          border:1px solid; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04); }
  .pill.pos { color:var(--status-pos); background:var(--status-pos-bg); border-color:#b3ccba; }
  .pill.neg { color:var(--status-neg); background:var(--status-neg-bg); border-color:#dcb3aa; }
  .pill.warn { color:var(--status-warn); background:var(--status-warn-bg); border-color:#d9c9a3; }
  .tag { font-size:10px; color:var(--text-secondary); background:var(--surface-alt);
         border:1px solid var(--border); border-radius:var(--radius-sm); padding:1px 6px; }
  .score { font-size:34px; font-weight:700; }
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .kv { font-size:12px; color:var(--text-secondary); margin-top:8px; }
  .bar { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px; }
  .bar .track { flex:1; height:10px; background:var(--surface-alt);
                border-radius:var(--radius-sm); overflow:hidden; }
  .bar .fill { display:block; height:100%; background:var(--viz-line);
               box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
  .bar.muted .fill { background:var(--viz-muted); }
  .bar .name { width:230px; white-space:nowrap; overflow:hidden;
               text-overflow:ellipsis; color:var(--text); }
  .bar.muted .name { color:var(--text-tertiary); }

  /* Action buttons — only shown when the dashboard is SERVED over http (a backend
     exists). Under file:// they are hidden and the page behaves exactly as before. */
  .panelhead { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .btnrow { display:flex; gap:8px; }
  .rowacts { display:inline-flex; gap:6px; margin-left:8px; align-items:center; }
  .note.ok { color:var(--status-pos); background:var(--status-pos-bg); border:1px solid #cfe0d4;
             border-radius:6px; padding:6px 10px; font-weight:600; margin:6px 0; }
  .btn { font:inherit; font-size:12px; font-weight:600; cursor:pointer;
         border:1px solid var(--border); border-radius:var(--radius-sm);
         background:var(--surface-alt); color:var(--text); padding:4px 10px; }
  .btn:hover { background:var(--bg); }
  .btn.primary { background:var(--accent-sage); border-color:var(--accent-sage); color:#fff; }
  .btn.sm { padding:2px 8px; font-size:11px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn:focus-visible { outline:2px solid var(--accent-sage); outline-offset:2px; }
  .verdict { font-size:11px; margin-top:3px; font-weight:600; }
  .verdict.implement { color:var(--status-pos); }
  .verdict.skip { color:var(--text-tertiary); }
  /* Scheduled jobs: two-up rows; a job that needs attention gets a warm edge. */
  .jobs { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .jobs > .sug:nth-child(2) { border-top:none; }
  @media (max-width:900px) { .jobs { grid-template-columns:1fr; }
    .jobs > .sug:nth-child(2) { border-top:1px solid var(--border); } }
  .jobrow.bad { border-left:3px solid var(--status-warn); padding-left:8px;
                background:var(--status-warn-bg); }
  .note { font-size:11px; color:var(--text-tertiary); margin-top:6px; }
  /* Action errors live in one banner: role=alert, kept until dismissed, never a dialog. */
  #action-banner { margin:8px 0; }
  #action-banner .banner { display:flex; gap:8px; align-items:flex-start; font-size:12px; margin:4px 0;
                           padding:6px 10px; border-radius:6px; border:1px solid #dcb3aa;
                           color:var(--status-neg); background:var(--status-neg-bg); }
  #action-banner .banner.warn { color:var(--status-warn); background:var(--status-warn-bg); border-color:#d9c9a3; }
  #action-banner .banner span { flex:1; overflow-wrap:anywhere; }
  .pill.wrap { white-space:normal; overflow-wrap:anywhere; max-width:480px; }

  /* Feature-toggle switches (served-mode only; see renderToggles()) */
  .togfam { border-top:1px solid var(--border); padding:10px 0; }
  .togfam:first-child { border-top:none; }
  .togfamhead { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .togfamname { font-weight:600; font-size:13px; }
  .togscope { font-size:10px; color:var(--text-tertiary); text-transform:uppercase;
              letter-spacing:.04em; margin-left:6px; }
  .togparams { margin:6px 0 0 4px; display:flex; flex-direction:column; gap:6px; }
  .togparam { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; }
  .togparam .togkey { color:var(--text-secondary); }
  .tograw { color:var(--text-tertiary, #888); font-size:10px; font-family:var(--font-mono, monospace); margin-left:6px; font-weight:400; }
  .togro { color:var(--text-tertiary); font-size:11px; margin-left:6px; }
  .togwarn { color:var(--status-neg); font-size:10px; margin-left:6px; }
  /* CSS-only tooltip (not the native `title` attribute — that's delayed ~1s and
     unreliable across browsers, notably Safari/macOS). data-tip holds the text;
     ::after renders it on hover/focus, positioned above the badge. */
  .tighelp { position:relative; display:inline-flex; align-items:center; justify-content:center;
    width:14px; height:14px; margin-left:5px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface-alt);
    color:var(--text-tertiary); font-size:9px; font-weight:700; line-height:1;
    cursor:help; flex:0 0 auto; }
  /* One fixed-position bubble, placed by JS (placeTip) and clamped to the
     viewport. A CSS ::after bubble clipped at the scrolling modal's edge. */
  #tiptip { position:fixed; left:0; top:0; max-width:min(280px, calc(100vw - 16px));
    background:var(--text); color:var(--surface); font-size:11px; font-weight:400;
    line-height:1.4; white-space:normal; overflow-wrap:anywhere; text-align:left; padding:6px 9px;
    border-radius:var(--radius-sm); box-shadow:var(--shadow);
    pointer-events:none; z-index:100; }
  .swtoggle { position:relative; display:inline-block; width:34px; height:19px; flex:0 0 auto; }
  .swtoggle input { opacity:0; width:0; height:0; }
  .swtoggle .swtrack { position:absolute; inset:0; background:var(--surface-alt);
    border:1px solid var(--border); border-radius:999px; cursor:pointer; transition:background .15s; }
  .swtoggle .swtrack::before { content:""; position:absolute; width:13px; height:13px; left:2px; top:2px;
    background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .swtoggle input:checked + .swtrack { background:var(--accent-sage); border-color:var(--accent-sage); }
  .swtoggle input:checked + .swtrack::before { transform:translateX(15px); }
  .swtoggle input:disabled + .swtrack { opacity:.5; cursor:default; }
  .togin { font:inherit; font-size:12px; width:90px; padding:2px 6px;
    border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); }
  .togin:disabled { opacity:.6; }
  /* Models panel and missing-model banner, served mode only */
  .banner { background:var(--status-neg-bg); color:var(--status-neg); border:1px solid #dcb3aa;
    border-radius:var(--radius-sm); padding:8px 12px; margin:0 0 16px; font-size:12px; font-weight:600; }
  .banner a { color:inherit; }

  .modtable { width:100%; border-collapse:collapse; font-size:12px; }
  .modtable th, .modtable td { text-align:left; padding:5px 6px; border-top:1px solid var(--border); }
  .modtable th { color:var(--text-tertiary); font-weight:600; font-size:11px; }

  .modtable tr:target td { background:var(--status-warn-bg); }
  .modtable select { font:inherit; font-size:12px; max-width:220px; }
  .modtablewrap { overflow-x:auto; }
  .modtable .pill { white-space:nowrap; }
</style>
</head>
<body>
  <div class="shell">
    <aside class="wikinav" aria-label="Wiki navigation">
      <span class="lbl">Wiki</span>
      <input type="text" class="wikisearch" id="wiki-search"
             placeholder="Search wiki…" aria-label="Search wiki" autocomplete="off">
      <div class="wikicount" id="wiki-count"></div>
      <nav class="wikilist" id="wiki-list"></nav>

  <div class="modal-overlay" id="settings-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modalhead">
        <span class="lbl" id="settings-title">Settings</span>
        <button class="btn sm" id="btn-settings-close" type="button">Close</button>
      </div>

        <div class="panelhead"><span class="lbl">Feature toggles</span></div>

  <div class="modal-overlay viewer-overlay" id="viewer-overlay" hidden>
    <div class="modal viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
      <div class="modalhead">
        <span class="lbl" id="viewer-title">Viewer</span>
        <div class="btnrow">
          <a class="btn sm" id="viewer-newtab" href="about:blank" target="_blank" rel="noopener noreferrer">Open in new tab</a>
          <button class="btn sm" id="viewer-close" type="button">Close</button>
        </div>
      </div>
      <iframe id="viewer-frame" title="Viewer" src="about:blank"
              sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
              referrerpolicy="no-referrer"></iframe>
    </div>
  </div>

<div id="tiptip" role="tooltip" hidden></div>
<script src="data/metrics.js"></script>
<script>
  // ---- pure helpers ----
  function scoreClass(n) { return n <= 33 ? "neg" : n <= 66 ? "warn" : "pos"; }
  function scoreColor(n) {
    return getComputedStyle(document.documentElement)
      .getPropertyValue("--status-" + scoreClass(n)).trim();
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function fmtDate(ts) { return (ts || "").slice(0, 10); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g,
      c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  }
  // plain-text of a tooltip's HTML, for a screen-reader aria-label on each data point.
  function plain(s) {
    return String(s == null ? "" : s).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
  }
  function avg(nums) {
    return nums.length ? Math.round(nums.reduce((a, b) => a + b, 0) / nums.length) : 0;
  }
  function fmtTok(n) {
    n = n || 0;
    return n >= 1e6 ? (n / 1e6).toFixed(1) + "M"
         : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
  }
  // Log10 domain that hugs the data, plus 1-2-5 ticks inside it (decades first;
  // 2s and 5s only when fewer than two decades fall inside).
  function logDomain(vals) {
    const pos = vals.filter(v => Number.isFinite(v) && v > 0);
    let lo = Math.log10(pos.length ? Math.min(...pos) : 1);
    let hi = Math.log10(pos.length ? Math.max(...pos) : 10);
    if (hi - lo < 1) { const m = (hi + lo) / 2; lo = m - 0.5; hi = m + 0.5; }
    const padL = (hi - lo) * 0.1;
    lo -= padL; hi += padL;
    const inside = v => Math.log10(v) >= lo && Math.log10(v) <= hi;
    const cand = mults => {
      const out = [];
      for (let e = Math.floor(lo); e <= Math.ceil(hi); e++)
        mults.forEach(m => { const v = m * 10 ** e; if (v >= 1 && inside(v)) out.push(v); });
      return out;
    };
    let ticks = cand([1]);
    if (ticks.length < 2) ticks = cand([1, 2, 5]);
    return { lo, hi, ticks };
  }
  function aggregateTokens(records) {
    const sum = { input: 0, output: 0, cache_read: 0, cache_creation: 0, total: 0 };
    const series = []; // output tokens per session — the cost driver
    records.forEach(r => {
      const t = (r.signals || {}).tokens || {};
      ["input", "output", "cache_read", "cache_creation", "total"]
        .forEach(k => sum[k] += t[k] || 0);
      series.push(t.output || 0);
    });
    return { sum, series };
  }
  function flattenSuggestions(records) {
    const out = [];
    records.forEach(r => (r.suggestions || []).forEach(s =>
      out.push(Object.assign({ ts: r.ts }, s))));
    return out.sort((a, b) => (b.confidence || 0) - (a.confidence || 0));
  }
  // Suggestions implemented/rejected in THIS page session — filtered out of every
  // render and removed from the DOM (incl. duplicates), so a resolved item never
  // lingers or reappears on a long-open tab. (Server-side build.py filters on reload.)
  const resolvedTexts = new Set();
  const normSug = t => (t || "").replace(/\s+/g, " ").trim().toLowerCase();
  function dropResolved(text) {
    resolvedTexts.add(normSug(text));
    elSug.querySelectorAll("[data-reject]").forEach(b => {
      if (normSug(b.getAttribute("data-reject")) === normSug(text)) b.closest(".sug")?.remove();
    });
  }
  function aggregateAssets(records) {
    const m = new Map(); // asset -> {asset, kind, used, seen}
    records.forEach(r => (r.assets_used || []).forEach(a => {
      const e = m.get(a.asset) || { asset: a.asset, kind: a.kind, used: 0, seen: 0 };
      e.seen += 1; if (a.used) e.used += 1;
      m.set(a.asset, e);
    }));
    return [...m.values()].sort((a, b) => b.used - a.used || b.seen - a.seen);
  }
  function aggregateHelped(records, limit) {
    // records are ts-ascending; walk newest-first so recent wins lead.
    const out = [];
    for (let i = records.length - 1; i >= 0 && out.length < limit; i--) {
      const r = records[i];
      (r.helped || []).forEach(h => out.push({ ts: r.ts, text: h }));
    }
    return out.slice(0, limit);
  }

  // ---- reusable line chart: line + dots + hover tooltip ----
  // Callers give y in a 0..H unit space. wireChart() sizes the viewBox to the
  // wrapper's real pixel size on render and on resize.
  // The scale stays 1:1, so dots stay round at any cell width.
  const H = 120, pad = 6, padX = 10;

  // points: [{ vy (0..H), color?, tip (html) }]. grids: [{ y (0..H), label }]
  // Labelled grids reserve a left gutter (GUT) for the tick text.
  const GUT = 30;
  function chartHTML(points, grids) {
    points.grids = grids || [];
    const dots = points.map((p, i) =>
      `<span class="pt" data-i="${i}" tabindex="0" role="img" ` +
      `aria-label="${esc(plain(p.tip))}"${p.color ? ` style="background:${p.color}"` : ""}></span>`).join("");
    return `<div class="chartwrap">
        <svg class="chart" aria-hidden="true"></svg>${dots}
        <div class="tip" hidden></div>
      </div>`;
  }

  function wireChart(wrap, points) {
    if (!wrap || !points.length) return;
    const svg = wrap.querySelector("svg");
    const tip = wrap.querySelector(".tip");
    const dots = [...wrap.querySelectorAll(".pt")];
    const n = points.length;
    let cur = -1, w = 0, h = 0;
    const left = points.grids.length ? GUT : padX;
    const xAt = i => n === 1 ? (left + w - padX) / 2 : left + i * (w - left - padX) / (n - 1);

    function draw() {
      const nw = Math.round(wrap.clientWidth) || 600, nh = Math.round(wrap.clientHeight) || H;
      if (nw === w && nh === h) return;
      w = nw;
      h = nh;
      const sy = h / H;
      points.forEach((p, i) => {
        p.px = xAt(i);
        p.py = Number.isFinite(p.vy) ? p.vy * sy : h - pad;
      });
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.setAttribute("width", w);
      svg.setAttribute("height", h);
      const g = points.grids.map(gr => {
        const gy = (gr.y * sy).toFixed(1);
        return `<line class="grid" x1="${left - 4}" y1="${gy}" x2="${w}" y2="${gy}"></line>` +
          `<text class="tick" x="${left - 8}" y="${gy}" text-anchor="end" dominant-baseline="middle">${gr.label}</text>`;
      }).join("");
      const line = points.filter(p => Number.isFinite(p.vy))
        .map(p => `${p.px.toFixed(1)},${p.py.toFixed(1)}`).join(" ");
      svg.innerHTML = `${g}<polyline points="${line}"></polyline>`;
      dots.forEach((el, i) => {
        el.style.left = points[i].px.toFixed(1) + "px";
        el.style.top = points[i].py.toFixed(1) + "px";
      });
      if (cur >= 0) { const c = cur; cur = -1; show(c); }
    }

    function show(i) {
      if (i === cur) return;
      cur = i;
      const p = points[i];
      tip.innerHTML = p.tip;
      tip.hidden = false;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      const tx = Math.max(0, Math.min(p.px - tw / 2, w - tw));
      let ty = p.py - th - 12;
      if (ty < 0) ty = p.py + 16;
      tip.style.left = tx + "px";
      tip.style.top = ty + "px";
      dots.forEach((el, j) => el.classList.toggle("on", j === i));
    }

    function hide() {
      cur = -1;
      tip.hidden = true;
      dots.forEach(el => el.classList.remove("on"));
    }

    draw();
    if (window.ResizeObserver) new ResizeObserver(draw).observe(wrap);
    else window.addEventListener("resize", draw);

    wrap.addEventListener("mousemove", e => {
      const x = e.clientX - wrap.getBoundingClientRect().left;
      const i = n === 1 ? 0 : Math.round((x - left) / (w - left - padX) * (n - 1));
      show(Math.max(0, Math.min(n - 1, i)));
    });
    wrap.addEventListener("mouseleave", hide);
    // Keyboard/AT access: each dot is focusable (tabindex + aria-label).
    // Focus shows the same tooltip, so keyboard and touch users get the detail too.
    dots.forEach((el, i) => {
      el.addEventListener("focus", () => show(i));
      el.addEventListener("blur", hide);
    });
  }

  function legend(keys) {
    return `<div class="legend">` + keys.map(k => k.hint
      ? `<span class="hint">${k.label}</span>`
      : `<span class="key"><span class="sw ${k.cls || ""}" ${k.color ? `style="background:${k.color}"` : ""}></span>${k.label}</span>`
    ).join("") + `</div>`;
  }

  // Expandable detail: a toggle plus the full text, hidden until the row is clicked.
  function detailRow(body) {
    if (!body) return "";
    return `<button type="button" class="detailtog" aria-expanded="false">Show text</button>` +
      `<pre class="detail" hidden>${esc(body)}</pre>`;
  }

  function wireDetails(root) {
    root.querySelectorAll(".detailtog").forEach(b => {
      const txt = b.closest(".txt");
      txt.classList.add("has-detail");
      txt.addEventListener("click", e => {
        if (e.target.closest(".detail")) return;
        const d = b.nextElementSibling, wasHidden = d.hidden;
        d.hidden = !wasHidden;
        b.setAttribute("aria-expanded", String(wasHidden));
        b.textContent = wasHidden ? "Hide text" : "Show text";
      });
    });
  }

  // ---- backend (only when SERVED over http) ----
  const SERVED = location.protocol === "http:" || location.protocol === "https:";
  // Every action failure ends up here: the pill on the row AND a banner that
  // stays until dismissed. Native dialogs are not used: embedded browsers suppress them.
  function notify(msg, level) {
    const host = document.getElementById("action-banner");
    if (!host) return;
    const d = document.createElement("div");
    d.className = "banner" + (level === "warn" ? " warn" : "");
    const t = document.createElement("span"); t.textContent = msg;
    const x = document.createElement("button");
    x.className = "btn sm"; x.type = "button"; x.textContent = "Dismiss";
    x.addEventListener("click", () => d.remove());
    d.append(t, x);
    host.appendChild(d);
  }

  // POST helper. A failure throws an Error whose message holds the server's
  // reason and hint, so every caller shows the same text.
  async function api(path, body) {
    let res;
    try {
      res = await fetch(path, {
        method: "POST",
        // X-Requested-With is the CSRF guard: a cross-origin form POST can't set a
        // custom header without a preflight the server refuses (see np-dashboard-server.py).
        headers: { "Content-Type": "application/json", "X-Requested-With": "nervepack" },
        body: body ? JSON.stringify(body) : null,
      });
    } catch (e) {
      const err = new Error("cannot reach the dashboard server. Is it still running? Reopen it with: cli.py open-dashboard");
      err.code = "unreachable"; throw err;
    }
    let data;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok || (data && data.ok === false)) {
      const base = (data && data.error) || ("HTTP " + res.status);
      const err = new Error(base + (data && data.hint ? " (" + data.hint + ")" : ""));
      err.code = (data && data.code) || ("http_" + res.status);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // On load, say up front when the buttons cannot work: an old server
  // (no api field) or a failing action self-check.
  const EXPECT_API = 2;
  async function checkActions() {
    let h;
    try { h = await (await fetch("/api/health")).json(); } catch (e) { return; }
    if (!h || (h.api || 0) < EXPECT_API) {
      notify("The dashboard server is out of date, so Apply, Graduate and Implement may fail. Reopen it with: cli.py open-dashboard", "warn");
      return;
    }
    try {
      const d = await (await fetch("/api/doctor")).json();
      (d.checks || []).filter(c => !c.ok && c.level === "fail").forEach(c =>
        notify("Action check failed: " + c.id + ": " + c.detail + (c.hint ? " (" + c.hint + ")" : ""), "warn"));
    } catch (e) { /* the check is advisory */ }
  }

  // ---- Implement queue count, served mode only ----
  let queueTimer = null;

  async function refreshQueue() {
    const el = document.getElementById("queue-count");
    if (!el) return;
    let q;
    try { q = await (await fetch("/api/implement-queue")).json(); } catch { return; }
    const n = (q.count || 0) + (q.running ? 1 : 0);
    el.hidden = !n;
    el.textContent = q.running ? `1 running, ${q.count || 0} queued` : `${q.count || 0} queued`;
    clearTimeout(queueTimer);
    if (n) queueTimer = setTimeout(refreshQueue, 5000);
  }

  // ---- Models panel and missing-model banner, served mode only ----
  // The Models section lives in the settings modal. Selecting a model writes a
  // per-machine models.<feature> param. Banner links open the modal at the row.
  const elModels = document.getElementById("panel-models");
  const elBanner = document.getElementById("model-banner");

  function paintBanner(m) {
    const probe = m.probe || {};
    const hits = [];
    (m.features || []).forEach(r => {
      if ((probe[r.effective] || {}).status === "missing") hits.push({ model: r.effective, key: r.key, feature: r.feature });
    });
    (m.model_errors || []).forEach(e => hits.push({ model: e.model, key: "implement", feature: e.feature || "implement" }));
    const seen = new Set();
    const uniq = hits.filter(h => !seen.has(h.model + h.key) && seen.add(h.model + h.key));
    if (!uniq.length) { elBanner.hidden = true; elBanner.innerHTML = ""; return; }
    elBanner.innerHTML = "Model unavailable: " + uniq.map(h =>
      `<a href="#model-row-${esc(h.key)}">${esc(h.model)} (${esc(h.feature)})</a>`).join(", ")
      + ". Pick another model in Settings.";
    elBanner.hidden = false;
  }

  function probeCell(p) {
    if (!p) return `<span class="pill">not probed</span>`;
    const cls = p.status === "available" ? "pos" : p.status === "missing" ? "neg" : "warn";
    const tip = esc((p.reason || "") + (p.ts ? " at " + p.ts : ""));
    return `<span class="pill ${cls}" title="${tip}">${esc(p.status)}</span>`;
  }

  function modelOptions(inv, sel, isTier) {
    const inherit = isTier ? "" : `<option value=""${sel ? "" : " selected"}>inherit tier</option>`;
    return inherit + inv.map(x => `<option value="${esc(x.id)}"${x.id === sel ? " selected" : ""}>`
      + `${esc(x.label || x.id)}${x.legacy ? " (legacy)" : ""}${x.tier === "premium" ? ", premium" : ""}</option>`).join("");
  }

  function modelRow(r, inv, probe) {
    const tag = r.is_tier ? "tier" : r.tier;
    return `<tr id="model-row-${esc(r.key)}">
        <td>${esc(r.feature)} <span class="togscope">${esc(tag)}</span></td>
        <td><select data-model-feature="${esc(r.key)}" aria-label="Model for ${esc(r.feature)}">${modelOptions(inv, r.selected, r.is_tier)}</select></td>
        <td><code>${esc(r.effective)}</code>${r.env_override ? ' <span class="togro">env override</span>' : ""}</td>
        <td>${probeCell(probe[r.effective])}</td>
        <td><button class="btn sm" data-probe="${esc(r.effective)}">Probe</button></td>
      </tr>`;
  }

  function renderModels(m) {
    paintBanner(m);
    if (!m.enabled) { elModels.hidden = true; return; }
    const inv = m.inventory || [], probe = m.probe || {};
    const rows = (m.features || []).map(r => modelRow(r, inv, probe)).join("");
    elModels.innerHTML = `<div class="panelhead"><span class="lbl">Models</span>
        <div class="btnrow"><button class="btn" id="btn-probe-all">Probe all</button></div></div>
      <div class="modtablewrap"><table class="modtable">
        <thead><tr><th>Feature</th><th>Selected</th><th>Effective</th><th>Probe</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="note">Selections are per machine (toggles.local). NP_LLM_MODEL_CHEAP and NP_LLM_MODEL_AGENT win when set.</div>`;
    elModels.hidden = false;
    wireModels();
    if (m.probe_running) {
      elModels.querySelectorAll("[data-probe], #btn-probe-all").forEach(b => { b.disabled = true; b.textContent = "Probing…"; });
      clearTimeout(probePoll);
      probePoll = setTimeout(refreshModels, 3000);
    }
  }
  let probePoll = null;

  function wireModels() {
    elModels.querySelectorAll("[data-model-feature]").forEach(sel =>
      sel.addEventListener("change", async () => {
        sel.disabled = true;
        try { renderModels((await api("/api/models/select", { feature: sel.dataset.modelFeature, model: sel.value })).models); }
        catch (e) { sel.disabled = false; notify("Model select failed: " + e.message); }
      }));
    const probeBtn = async (btn, model) => {
      btn.disabled = true; btn.textContent = "Probing…";
      try { await api("/api/models/probe", model ? { model } : {}); await refreshModels(); }
      catch (e) { btn.disabled = false; btn.textContent = "Probe"; notify("Probe failed: " + e.message); }
    };
    elModels.querySelectorAll("[data-probe]").forEach(b => b.addEventListener("click", () => probeBtn(b, b.dataset.probe)));
    const all = document.getElementById("btn-probe-all");
    if (all) all.addEventListener("click", () => probeBtn(all, ""));
  }

  async function refreshModels() {
    try { renderModels(await (await fetch("/api/models")).json()); } catch { /* older server without the route */ }
  }
  if (SERVED) refreshModels();

  // ---- Scheduled jobs (GET /api/jobs, np_job_health). Served mode only. ----
  const elJobs = document.getElementById("panel-jobs");
  const JOB_PILL = { ok: "pos", warn: "warn", error: "neg" };
  const jobBad = j => j.enabled !== false && (j.overdue || j.status === "warn" || j.status === "error"
    || j.installed === false || (j.exit != null && j.exit !== 0));
  function jobAge(h) {
    if (h == null || !Number.isFinite(h)) return "never run";
    if (h < 1) return Math.round(h * 60) + "m ago";
    return h < 48 ? Math.round(h) + "h ago" : Math.round(h / 24) + "d ago";
  }
  function jobSummary(jobs) {
    const n = s => jobs.filter(j => j.enabled !== false && j.status === s).length;
    const parts = [`${jobs.length} job${jobs.length === 1 ? "" : "s"}`];
    const err = n("error"), warn = n("warn");
    const late = jobs.filter(j => j.enabled !== false && j.overdue).length;
    if (err) parts.push(`${err} error${err === 1 ? "" : "s"}`);
    if (warn) parts.push(`${warn} warning${warn === 1 ? "" : "s"}`);
    if (late) parts.push(`${late} overdue`);
    const off = jobs.filter(j => j.enabled === false).length;
    if (parts.length === 1) parts.push(off ? "rest ok" : "all ok");
    if (off) parts.push(`${off} off`);
    return parts.join(", ");
  }
  function renderJobs(jobs, served) {
    const head = `<span class="lbl">Scheduled jobs</span>`;
    if (!Array.isArray(jobs)) {
      elJobs.innerHTML = head + empty(served
        ? "Could not load job health from the dashboard server. Check its log, then reload."
        : "Job health needs the dashboard server. Open the served dashboard to see scheduled jobs.");
      return;
    }
    if (!jobs.length) { elJobs.innerHTML = head + empty("No scheduled jobs found."); return; }
    const rows = [...jobs].sort((a, b) => jobBad(b) - jobBad(a)).map(j => {
      const pill = JOB_PILL[j.status] || "";
      const on = j.enabled !== false
      const flags = !on ? "" : [
        j.overdue ? `<span class="pill warn">overdue</span>` : "",
        j.installed === false ? `<span class="pill neg">not installed</span>` : "",
        j.exit != null && j.exit !== 0 ? `<span class="pill neg">exit ${esc(j.exit)}</span>` : "",
      ].join(" ");
      return `<div class="sug jobrow${jobBad(j) ? " bad" : ""}">
        <div class="txt"><b>${esc(j.name)}</b> <span class="pill ${pill}">${esc(j.status || "unknown")}</span> ${flags}
          <div class="meta">${jobAge(j.age_h)} · ${esc(j.schedule || "")} · ${j.enabled === false ? "toggle off" : "toggle on"}</div>
        </div></div>`;
    }).join("");
    elJobs.innerHTML = head + `<div class="kv">${esc(jobSummary(jobs))}</div><div class="jobs">${rows}</div>`;
  }
  async function refreshJobs() {
    try {

  const VIEW = new URLSearchParams(location.search).get("view") || "";
  const SANDBOX = {
    // Rendered wiki pages run mermaid but need no origin, storage or parent access.
    PAGE: "allow-scripts allow-popups allow-popups-to-escape-sandbox",

    APP: "allow-scripts allow-same-origin allow-forms allow-modals",

  let viewerOpener = null, viewerOnClose = null;
  function openViewer(url, opts = {}) {
    viewerOpener = document.activeElement;
    viewerOnClose = opts.onClose || null;
    // A fresh frame per open, so its sandbox is fixed at creation. Flipping the
    // attribute on a live frame is unreliable across browsers.
    const f = viewerFrame.cloneNode(false);
    f.setAttribute("sandbox", opts.sandbox || SANDBOX.PAGE);
    f.setAttribute("referrerpolicy", "no-referrer");
    f.src = url;
    f.addEventListener("load", wireFrameEsc);
    viewerFrame.replaceWith(f);
    viewerFrame = f;
    viewerNewTab.href = url;
    document.getElementById("viewer-title").textContent = opts.title || "Viewer";
    viewerOverlay.hidden = false;
    document.getElementById("viewer-close").focus();

  function closeViewer() {
    if (viewerOverlay.hidden) return;
    viewerOverlay.hidden = true;

    const after = viewerOnClose; viewerOnClose = null;

  // Esc inside a same-origin view closes too. A sandboxed page is cross-origin,

  function wireFrameEsc() {

  function paramControl(fam, p) {

      ? `<span class="togro" title="Controls this dashboard — edit via the cli.py toggle command">locked</span>`

      control = `<label class="swtoggle"><input type="checkbox" data-key="${esc(dotted)}" data-kind="param-bool"

  function wireToggleInputs() {
    elToggles.querySelectorAll("input[data-kind='feature']").forEach(input => {
      input.addEventListener("change", async () => {
        const key = input.dataset.key, next = input.checked ? "on" : "off";
        if (input.dataset.scope === "shared" && !confirm(
          `"${key}" is a shared toggle — flipping it will commit + push toggles.conf. Continue?`)) {
          input.checked = !input.checked; return;
        }
        input.disabled = true;
        try { await api("/api/toggle", { key, value: next }); }
        catch (e) { input.checked = !input.checked; notify("Toggle failed: " + e.message); }
        finally { input.disabled = false; }
      });
    });
    elToggles.querySelectorAll("[data-kind^='param-']").forEach(el => {
      el.addEventListener("change", async () => {
        const key = el.dataset.key;
        const isBool = el.dataset.kind === "param-bool";
        const value = isBool ? (el.checked ? "on" : "off") : String(el.value);
        el.disabled = true;
        try {
          await api("/api/toggle", { key, value });

        } catch (e) {
          if (isBool) el.checked = el.dataset.saved === "on"; else el.value = el.dataset.saved;
          notify("Toggle failed: " + e.message);
