  // Poll one job's status until it ends. `on` maps a state to a handler; a
  // handler returns true to stop. A dead server or a bad reply is shown, not
  // swallowed: after 5 straight failures the caller hears about it.
  function pollStatus(text, on) {
    let tries = 0, bad = 0;
    const tick = () => setTimeout(async () => {
      let s;
      try {
        const res = await fetch("/api/implement-status?text=" + encodeURIComponent(text));
        if (!res.ok) throw new Error("HTTP " + res.status);
        s = await res.json(); bad = 0;
      } catch (e) {
        if (++bad >= 5) return on.lost && on.lost(e.message);
        return tick();
      }
      if (s.state === "queued") { on.queued && on.queued(s); return tick(); }
      const h = on[s.state];
      if (h) return h(s);
      if (++tries < 220) { if (s.state === "running" && on.running) on.running(s); return tick(); }
      on.timeout && on.timeout(s);
    }, 3000);
    tick();
  }

  // Shared runner for agent jobs queued through the implement machinery
  // (compact Apply, graduation Graduate). Starts the job, then polls.
  async function runJob(b, route, body, onDone) {
    const acts = b.closest(".rowacts");
    const buttons = [...acts.querySelectorAll("button")];
    buttons.forEach(x => x.style.display = "none");
    const pill = document.createElement("span");
    acts.appendChild(pill);
    const set = (cls, t) => { pill.className = "pill wrap " + cls; pill.textContent = t; };
    const restore = () => buttons.forEach(x => x.style.display = "");
    const fail = (msg) => { set("neg", "✕ " + msg); notify(msg); restore(); };
    set("warn", "⋯ Starting…");
    let r;
    try { r = await api(route, body); }
    catch (e) { fail(e.message); return; }
    if (r.deduped) set("warn", "⋯ Already queued");
    refreshQueue();
    const ref = s => s.ref ? ": " + s.ref : "";
    const logHint = s => s.log ? " (log: " + s.log + ")" : "";
    pollStatus(r.text, {
      done: s => { set("pos", "✓ Done" + ref(s)); if (onDone) onDone(); },
      not_implementable: s => { set("warn", "▲ Left open" + ref(s)); restore(); },
      stale: s => fail("Already handled or out of date" + ref(s) + ". Reload the page."),
      failed: s => fail("Failed" + ref(s) + logHint(s)),
      queued: s => set("warn", "⋯ Queued" + (s.position ? " #" + s.position : "")),
      running: () => set("warn", "⋯ Running…"),
      timeout: () => set("warn", "… still running, refresh the page later"),
      lost: m => fail("Lost contact with the dashboard server (" + m + ")"),
    });
  }

  // Compact proposals from the weekly-compact agent (compact-proposals/<date>.md),
  // one row per `### a vs b` entry. Reject notes it in REJECTED.md and drops the
  // entry. Apply queues an agent job that applies it per AGENTS.md. A "keep
  // separate" recommendation makes Reject the primary, one-click action.
  const elProp = document.getElementById("panel-proposals");
  function renderProposals() {
    const P = Array.isArray(window.PROPOSALS) ? window.PROPOSALS : [];
    const rows = [];
    P.forEach(f => (f.proposals || []).forEach(p => rows.push(Object.assign({ file: f.file, date: f.date }, p))));
    const paint = () => {
      if (!elProp.querySelector(".sug")) elProp.innerHTML = `<span class="lbl">Compact proposals</span>` + empty("No compact proposals awaiting review.");
    };
    elProp.innerHTML = `<span class="lbl">Compact proposals</span>` + rows.map(p => `<div class="sug" data-file="${esc(p.file)}" data-title="${esc(p.title)}">
        <div class="txt"><b>${esc(p.title)}</b>
          <div class="meta">${esc(p.date || "")} · ${p.recommendation ? esc(p.recommendation) : "no recommendation"}</div>
          ${detailRow(p.body)}
        </div>${SERVED ? `<span class="rowacts">
          <!-- Apply is always primary to match the other approve actions. -->
          <button class="btn sm primary" data-apply>Apply</button>
          <button class="btn sm" data-reject-prop>Reject</button>
        </span>` : ""}
      </div>`).join("")
      + (rows.length && !SERVED ? `<div class="note">Open the served dashboard for the Apply / Reject buttons.</div>` : "");
    paint();
    wireDetails(elProp);
    if (!SERVED) return;
    const body = row => ({ file: row.dataset.file, title: row.dataset.title });
    elProp.querySelectorAll("[data-reject-prop]").forEach(b => b.addEventListener("click", async () => {
      const row = b.closest(".sug");
      b.disabled = true;
      try { await api("/api/compact/reject", body(row)); row.remove(); paint(); }
      catch (e) { b.disabled = false; notify("Reject failed: " + e.message); }
    }));
    elProp.querySelectorAll("[data-apply]").forEach(b => b.addEventListener("click", () => {
      const row = b.closest(".sug");
      runJob(b, "/api/compact/apply", body(row), () => setTimeout(() => { row.remove(); paint(); }, 4000));
    }));
  }

  // B4 · Back-capture backlog: how many prior sessions are still waiting on
  // np-backcapture-sweep.sh, how close the oldest one is to falling outside the
  // memory.backcapture_days discovery ceiling (past that point a never-yet-seen
  // session would be permanently lost — see np-backcapture-sweep.sh header), and
  // the last-24h drain rate. Independent of session records, so it renders in both
  // the empty and populated branches. Fail-open: no/missing data -> zeroed stats,
  // never a crash.
  function renderBacklog() {
    const B = window.BACKLOG || { pending: 0, oldest_pending_days: null, ceiling_days: 7, resolved_last_24h: 0 };
    const ceiling = B.ceiling_days || 7;
    const oldest = B.oldest_pending_days;
    const pct = oldest != null ? oldest / ceiling : 0;
    const ageColor = pct >= 0.85 ? "var(--status-neg)" : pct >= 0.6 ? "var(--status-warn)" : "var(--text)";
    const ageLabel = oldest != null ? `${oldest}<span style="font-size:12px">/${ceiling}d</span>` : "—";
    const note = oldest != null && pct >= 0.85
      ? `<div class="note">oldest pending item is within ${Math.round((1 - pct) * ceiling * 10) / 10}d of the discovery ceiling — items this old that were never queued are permanently lost past ${ceiling}d</div>`
      : "";
    elBacklog.innerHTML = `<span class="lbl">Back-capture backlog</span>
      <div class="statstrip">
        <div class="stat"><b>${B.pending}</b><span>sessions pending</span></div>
        <div class="stat"><b style="color:${ageColor}">${ageLabel}</b><span>oldest pending age</span></div>
        <div class="stat"><b>${B.resolved_last_24h}</b><span>resolved last 24h</span></div>
      </div>
      ${note}`;
  }

  // F5/#251 · Change ledger: change-keyed (spec, tier, gate verdicts, merge SHA),
  // distinct from the session-keyed trend/tokens panels above. Independent of
  // session records, so it renders in both the empty and populated branches.
  // Fail-open: no/empty data -> empty state, never a crash. Rows already capped
  // to the most recent 50 by build.py; this only renders what it's given.
  const GATE_ICON = { PASSED: "✅", FAILED: "❌", SKIPPED: "⚪" };
  function renderLedger() {
    const L = Array.isArray(window.LEDGER) ? window.LEDGER : [];
    elLedger.innerHTML = `<span class="lbl">Change ledger</span>` + (L.length
      ? [...L].reverse().map(e => {
          const gates = Array.isArray(e.gates) ? e.gates : [];
          const gateSummary = gates.map(g =>
            `<span title="${esc(g.name || "")}">${GATE_ICON[g.verdict] || "❔"}</span>`).join(" ");
          const spec = e.spec ? `<code>${esc(e.spec)}</code>` : "—";
          const mergeShort = (e.merge_sha || "").slice(0, 12);
          return `<div class="sug">
            <div class="txt">
              <span class="tag">${esc(e.tier || "?")}</span> <b>${esc(e.change_id || "?")}</b>
              <div class="meta">${spec} · ${gateSummary || "no gate data"} · <code>${esc(mergeShort)}</code> · ${fmtDate(e.ts)}</div>
            </div>
          </div>`;
        }).join("")
      : empty("No changes recorded yet."));
  }

  if (!M.length) {
    document.getElementById("subtitle").textContent = "0 sessions recorded yet" + learnedNote;
    elTrend.innerHTML = `<span class="lbl">Trend</span>` + empty("No sessions recorded yet.");
    elTokens.innerHTML = `<span class="lbl">Token usage</span>` + empty("No token data yet.");
    elSug.innerHTML = `<span class="lbl">Suggestions</span>` + empty("Nothing to act on yet.");
    elLatest.innerHTML = `<span class="lbl">Latest session</span>` + empty("No session yet.");
    elAssets.innerHTML = `<span class="lbl">Asset usefulness</span>` + empty("No asset usage yet.");
    elWins.innerHTML = `<span class="lbl">Wins &amp; learnings</span>` + empty("No wins recorded yet.");
    renderGraduation();
    renderProposals();
    renderToggles();
    renderBacklog();
    renderLedger();
  } else {
    const scores = M.map(r => r.contribution_score || 0);
    const struggles = M.reduce((a, r) => a + ((r.signals || {}).struggles || 0), 0);
    const wins = M.reduce((a, r) => a + ((r.helped || []).length), 0);
    document.getElementById("subtitle").textContent =
      `${M.length} sessions · ${fmtDate(M[0].ts)} – ${fmtDate(M[M.length - 1].ts)} · updated daily` + learnedNote;

    // A · Trend (hero) — score per session, colored by band, hover for detail
    // Fixed 0–100 scale (honest: a low score must look low).
    // Point markers (SVG circles) make a flat low line readable against baseline.
    const y = v => H - pad - (v / 100) * (H - 2 * pad);
    const trendPts = scores.map((v, i) => {
      const r = M[i], s = r.signals || {};
      return {
        vy: y(v), color: scoreColor(v),
        tip: `<div class="t-date">${fmtDate(r.ts)}${r.project ? " · " + esc(r.project) : ""}</div>
          <div class="t-hd" style="color:${scoreColor(v)}">${v}<span style="font-size:11px;color:var(--text-tertiary)">/100</span></div>
          <div class="t-row"><span>tool calls</span><span>${s.tool_calls || 0}</span></div>
          <div class="t-row"><span>skills</span><span>${(s.skills_invoked || []).length}</span></div>
          <div class="t-row"><span>output tok</span><span>${fmtTok((s.tokens || {}).output)}</span></div>
          <div class="t-row"><span>wins</span><span>${(r.helped || []).length}</span></div>
          <div class="t-row"><span>struggles</span><span>${s.struggles || 0}</span></div>
          ${(s.playbook_fires || 0) ? `<div class="t-row"><span>playbooks</span><span>${s.playbook_heeded || 0}/${s.playbook_fires} heeded</span></div>` : ""}`,
      };
    });
    elTrend.innerHTML = `
      <span class="lbl">Trend · contribution score</span>
      <div class="statstrip">
        <div class="stat"><b>${avg(scores)}</b><span>avg score</span></div>
        <div class="stat"><b>${M.length}</b><span>sessions</span></div>
        <div class="stat"><b>${wins}</b><span>total wins</span></div>
        <div class="stat"><b>${struggles}</b><span>total struggles</span></div>
      </div>
      ${chartHTML(trendPts, [0, 33, 67, 100].map(v => ({ y: y(v), label: v })))}
      ${legend([
        { cls: "dot", color: "var(--status-pos)", label: "≥67" },
        { cls: "dot", color: "var(--status-warn)", label: "34–66" },
        { cls: "dot", color: "var(--status-neg)", label: "≤33" },
        { cls: "grid", label: "33 / 67 thresholds" },
        { hint: true, label: "hover a point for session stats" },
      ])}`;
    wireChart(elTrend.querySelector(".chartwrap"), trendPts);

    // A2 · Token usage (deterministic — summed once per assistant message.id)
    // Log scale: per-session output spans 2+ decades; linear would crush most
    // sessions into a sliver under one outlier. The domain hugs the data
    // (min..max, padded 10% in log space) so dots fill the plot, and labelled
    // decade gridlines make the scale readable.
    const tk = aggregateTokens(M);
    const td = logDomain(tk.series);
    const ty = v => H - pad - (Math.log10(Math.max(v, 1)) - td.lo) / (td.hi - td.lo) * (H - 2 * pad);
    const tokGrids = td.ticks.map(v => ({ y: ty(v), label: fmtTok(v) }));
    const tokPts = tk.series.map((v, i) => {
      const r = M[i], t = (r.signals || {}).tokens || {};
      return {
        vy: ty(v),
        tip: `<div class="t-date">${fmtDate(r.ts)}${r.project ? " · " + esc(r.project) : ""}</div>
          <div class="t-hd">${fmtTok(v)}<span style="font-size:11px;color:var(--text-tertiary)"> out</span></div>
          <div class="t-row"><span>total</span><span>${fmtTok(t.total)}</span></div>
          <div class="t-row"><span>input</span><span>${fmtTok(t.input)}</span></div>
          <div class="t-row"><span>cache read</span><span>${fmtTok(t.cache_read)}</span></div>
          <div class="t-row"><span>cache write</span><span>${fmtTok(t.cache_creation)}</span></div>`,
      };
    });
    // Est. tokens saved: cache_read lower bound, net of directive overhead.
    // Formula: sum of max(0, cache_read - directive_tokens) per session.
    const savedFormula = "∑ max(0, cache_read − directive_tokens) per session\n" +
      "cache_read: tokens served from cache (not reprocessed)\n" +
      "directive_tokens: nervepack's own injection cost (subtracted)\n" +
      "Lower bound — does not include skill/recall counterfactuals.";
    elTokens.innerHTML = `
      <span class="lbl">Token usage · deterministic · output / session · log scale</span>
      <div class="statstrip tokstrip">
        <div class="stat"><b>${fmtTok(tk.sum.output)}</b><span>output (generated)</span></div>
        <div class="stat"><b>${fmtTok(tk.sum.input)}</b><span>input (fresh)</span></div>
        <div class="stat"><b>${fmtTok(tk.sum.cache_creation)}</b><span>cache write</span></div>
        <div class="stat"><b>${fmtTok(tk.sum.cache_read)}</b><span>cache read</span></div>
        <div class="stat"><b>${fmtTok(avg(tk.series))}</b><span>avg output / session</span></div>
      </div>
      <div class="statstrip" style="border-top:1px solid var(--border);padding-top:10px;margin-top:2px">
        <div class="stat" title="${esc(savedFormula)}" style="cursor:help">
          <b style="color:var(--status-pos)">${fmtTok(S.total)}</b>
          <span>est. tokens saved (cache lower bound) ⓘ</span>
        </div>
        <div class="stat" title="${esc(savedFormula)}" style="cursor:help">
          <b style="color:var(--status-pos)">${fmtTok(S.per_session)}</b>
          <span>est. saved / session ⓘ</span>
        </div>
      </div>
      ${chartHTML(tokPts, tokGrids)}
      ${legend([
        { cls: "dot", color: "var(--viz-line)", label: "output tokens / session" },
        { hint: true, label: "hover a point for the full token breakdown" },
      ])}`;

    wireChart(elTokens.querySelector(".chartwrap"), tokPts);

    // B · Suggestions (+ http-only actions: per-row Implement / Reject, header Review / Clear)
    let sugs = flattenSuggestions(M);

    function sugRow(s) {
      const conf = Math.round((s.confidence || 0) * 100);
      const cls = conf <= 33 ? "neg" : conf <= 66 ? "warn" : "pos";
      const verdict = s.verdict ? `<div class="verdict ${s.verdict.decision === "implement" ? "implement" : "skip"}">${s.verdict.decision === "implement" ? "✓ build" : "↓ skip"} — ${esc(s.verdict.reason || "")}</div>` : "";
      const rowActs = SERVED ? `<span class="rowacts">
            <button class="btn sm primary" data-implement="${esc(s.text)}" data-target="${esc(s.target || "")}">Implement</button>
            <button class="btn sm" data-modify="${esc(s.text)}" title="Edit the wording before implementing — the agent gets your version">Modify</button>
            <button class="btn sm" data-reject="${esc(s.text)}">Reject</button>
          </span>` : "";
      return `<div class="sug">
        <div class="txt"><span class="sugtext">${esc(s.text)}</span>${verdict}
          <div class="meta"><span class="tag">${esc(s.target || "other")}</span>
            ${s.auto_safe ? '<span class="tag">auto-safe</span>' : ""} · ${fmtDate(s.ts)}</div>
        </div>
        <span class="pill ${cls}">${conf}%</span>${rowActs}
      </div>`;
    }

    // 10 per page. Review / Clear re-render from page 1. Paging keeps the filters.
    const SUG_PAGE = 10;
    let sugPage = 0;
    function renderSug(list, note, keepPage) {
      list = (list || []).filter(s => !resolvedTexts.has(normSug(s.text)));   // never show resolved
      const pages = Math.max(1, Math.ceil(list.length / SUG_PAGE));
      sugPage = keepPage ? Math.min(sugPage, pages - 1) : 0;
      const shown = list.slice(sugPage * SUG_PAGE, (sugPage + 1) * SUG_PAGE);
      const pager = pages > 1
        ? `<div class="pager">
             <button class="btn sm" id="sug-prev" type="button"${sugPage === 0 ? " disabled" : ""}>‹ Prev</button>
             <span>Page ${sugPage + 1} of ${pages} · ${list.length} total</span>
             <button class="btn sm" id="sug-next" type="button"${sugPage >= pages - 1 ? " disabled" : ""}>Next ›</button>
           </div>`
        : "";
      const actions = SERVED
        ? `<div class="btnrow">
             <button class="btn" id="btn-mode" title="How Implement applies a change — PR: branch + pull request for review; direct: commit to main and push (no review gate)">Mode: …</button>
             <span class="pill warn" id="queue-count" hidden></span>
             <button class="btn" id="btn-review">Review</button>
             <button class="btn primary" id="btn-clear">Clear</button>
           </div>`
        : "";
      elSug.innerHTML = `<div class="panelhead"><span class="lbl">Suggestions</span>${actions}</div>`
        + (list.length ? shown.map(sugRow).join("") + pager : empty("Nothing to act on yet."))
        + (note ? `<div class="note">${note}</div>` : "")
        + (SERVED ? "" : `<div class="note">Open the served dashboard (evaluator.dashboard_serve on) for the Review / Clear and per-row Implement / Reject buttons.</div>`);
      const turn = d => () => { sugPage += d; renderSug(list, note, true); elSug.scrollIntoView({ block: "start" }); };
      document.getElementById("sug-prev")?.addEventListener("click", turn(-1));
      document.getElementById("sug-next")?.addEventListener("click", turn(1));
      if (SERVED) wireSugActions(list);
    }

    function wireSugActions(list) {
      // Implement mode selector (pr | direct) — writes a per-machine toggle override
      const modeBtn = document.getElementById("btn-mode");
      if (modeBtn) {
        const paint = m => {
          const direct = m === "direct";
          modeBtn.dataset.mode = direct ? "direct" : "pr";
          modeBtn.textContent = "Mode: " + (direct ? "direct ⚠" : "PR");
          modeBtn.classList.toggle("primary", direct);
        };
        fetch("/api/config").then(r => r.json()).then(c => paint(c.implement_mode)).catch(() => paint("pr"));
        modeBtn.addEventListener("click", async () => {
          const next = modeBtn.dataset.mode === "direct" ? "pr" : "direct";
          if (next === "direct" && !confirm(
            "Direct mode commits straight to main and pushes — no PR review gate. Switch to direct?")) return;
          modeBtn.disabled = true;
          try { paint((await api("/api/implement-mode", { mode: next })).mode); }
          catch (e) { notify("Mode switch failed: " + e.message); }
          finally { modeBtn.disabled = false; }
        });
      }
      // Reject → resolve (disregard, off the list)
      elSug.querySelectorAll("[data-reject]").forEach(b =>
        b.addEventListener("click", async () => {
          b.disabled = true;
          try { await api("/api/resolve", { text: b.getAttribute("data-reject") });
                dropResolved(b.getAttribute("data-reject")); }
          catch (e) { b.disabled = false; notify("Reject failed: " + e.message); }
        }));
      // Implement → start the async agentic job, then POLL its status so the row
      // updates itself (✓ done & removed, or back to the buttons on failure) with no
      // manual refresh. The agent takes ~1-2 min; the pill shows live progress.
      elSug.querySelectorAll("[data-implement]").forEach(b =>
        b.addEventListener("click", () => startImplement(b, b.getAttribute("data-implement"))));

      // Modify → edit the wording in place, then implement YOUR text. The row's own
      // buttons are hidden rather than replaced, so cancelling restores a row whose
      // listeners are still attached (re-rendering them would drop the wiring).
      elSug.querySelectorAll("[data-modify]").forEach(b =>
        b.addEventListener("click", () => openEditor(b)));

      function openEditor(b) {
        const text = b.getAttribute("data-modify");
        const row = b.closest(".sug"), txt = row.querySelector(".txt"), acts = row.querySelector(".rowacts");
        if (row.querySelector(".sugedit")) return;
        const sugtext = txt.querySelector(".sugtext");
        const own = [...acts.children];

        const ta = document.createElement("textarea");
        ta.className = "sugedit"; ta.rows = 3; ta.value = text;
        ta.setAttribute("aria-label", "Edit this suggestion before implementing");
        sugtext.hidden = true;
        txt.insertBefore(ta, txt.firstChild);

        const go = document.createElement("button");
        go.className = "btn sm primary"; go.textContent = "Implement";
        const cancel = document.createElement("button");
        cancel.className = "btn sm"; cancel.textContent = "Cancel";
        own.forEach(x => x.hidden = true);
        acts.append(go, cancel);
        ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);

        const close = () => { ta.remove(); go.remove(); cancel.remove();
                              sugtext.hidden = false; own.forEach(x => x.hidden = false); };
        cancel.addEventListener("click", close);
        ta.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
        go.addEventListener("click", () => {
          const edited = ta.value.trim();
          if (!edited) return ta.focus();
          ta.remove(); go.remove(); cancel.remove();
          sugtext.textContent = edited; sugtext.hidden = false;
          own.forEach(x => x.hidden = false);
          startImplement(own[0], text, edited);
        });
      }

      // The evaluator's target tag, read off the row's Implement button, which the
      // Modify editor hides rather than removes. It picks the repo tried first.
      const tgtOf = row => row.querySelector("[data-implement]")?.getAttribute("data-target") || ""

      async function startImplement(b, text, edited) {
        const row = b.closest(".sug"), acts = row.querySelector(".rowacts");
        const buttons = [...row.querySelectorAll("button")];
        buttons.forEach(x => x.style.display = "none");
        const pill = document.createElement("span");
        acts.appendChild(pill);
        const setPill = (cls, txt) => { pill.className = "pill wrap " + cls; pill.textContent = txt; };
        const back = () => buttons.forEach(x => x.style.display = "");
        const fail = msg => { setPill("neg", "✕ " + msg); notify(msg); back(); };
        setPill("warn", "⋯ Starting…");
        // A busy server queues the job, so rapid clicks on several rows are fine.
        let r;
        try { r = await api("/api/implement", { text, edited: edited || "", target: tgtOf(row) }); }
        catch (e) { fail(e.message); return; }
        refreshQueue();
        const logHint = s => s.log ? " (log: " + s.log + ")" : "";
        pollStatus(r.text || text, {
          done: s => {
            const ref = s.ref || "", isUrl = /^https?:\/\//.test(ref);
            const link = isUrl
              ? ` — <a href="${esc(ref)}" target="_blank">${esc(ref.replace(/^https?:\/\/github\.com\//, ""))}</a>`
              : (ref ? " — " + esc(ref) : "");
            const note = document.createElement("div");
            note.className = "note ok"; note.innerHTML = "✓ Implemented" + link + esc(logHint(s));
            elSug.querySelector(".panelhead").after(note);
            dropResolved(text);
          },
          // Another machine sharing this content overlay got there first.
          already_resolved: () => dropResolved(text),
          not_implementable: s => { setPill("warn", "▲ Not a code change, left open" + (s.ref ? ": " + s.ref : "") + logHint(s)); back(); },
          failed: s => {
            if (s.model_error) {
              pill.className = "pill neg"; pill.textContent = "✕ Model " + (s.model || "") + " unavailable: ";
              const a = document.createElement("a");
              a.href = "#model-row-implement"; a.textContent = "pick another";
              pill.append(a);
              notify("Model " + (s.model || "") + " is unavailable. Pick another in the model row.");
              refreshModels(); back();
            } else fail("Failed" + (s.ref ? ": " + s.ref : "") + logHint(s));
          },
          stale: s => fail("Already handled or out of date" + (s.ref ? ": " + s.ref : "") + ". Reload the page."),
          // Queue time does not count toward the polling cap.
          queued: s => setPill("warn", "⋯ Queued" + (s.position ? " #" + s.position : "")),
          running: () => setPill("warn", edited ? "⋯ Implementing your edit…" : "⋯ Implementing…"),
          timeout: () => setPill("warn", "… still running, check back later"),
          lost: m => fail("Lost contact with the dashboard server (" + m + ")"),
        });
      }
      const review = document.getElementById("btn-review");
      if (review) review.addEventListener("click", async () => {
        review.disabled = true; review.textContent = "Reviewing…";
        try {
          const r = await api("/api/review", {});
          const rows = (r.rows || []).map(x => Object.assign({ ts: x.ts || "" }, x));
          renderSug(rows, r.degraded
            ? "Ranked by confidence — model verdicts unavailable (model seam offline)."
            : "Verdicts from a single Haiku pass — Implement or Reject each, or Clear all.");
        } catch (e) { review.disabled = false; review.textContent = "Review"; notify("Review failed: " + e.message); }
      });
      const clear = document.getElementById("btn-clear");
      if (clear) clear.addEventListener("click", async () => {
        if (!confirm("Resolve ALL open suggestions so they reset and accumulate again?")) return;
        clear.disabled = true; clear.textContent = "Clearing…";
        try { const r = await api("/api/clear", {});
              renderSug([], `Cleared ${r.count || 0} suggestion(s). New ones will accumulate.`); }
        catch (e) { clear.disabled = false; clear.textContent = "Clear"; notify("Clear failed: " + e.message); }
      });
    }

    renderSug(sugs);
    if (SERVED) { refreshQueue(); checkActions(); }

    // B2 · Wins & learnings (positive mirror of struggles): strategies-learned
    // count + chips, then the 6 most-recent helped[] items (✓ + --status-pos).
    const winsList = aggregateHelped(M, 6);
    const stratTags = (L.strategy_names || [])
      .map(n => `<span class="tag">${esc(n)}</span>`).join(" ");
    elWins.innerHTML = `<span class="lbl">Wins &amp; learnings</span>
      <div class="statstrip">
        <div class="stat"><b>${L.strategies}</b><span>strategies learned</span></div>
      </div>
      ${stratTags ? `<div class="pills">${stratTags}</div>` : ""}
      ${winsList.length ? winsList.map(w => `<div class="sug">
        <div class="txt"><span style="color:var(--status-pos);font-weight:700">✓</span> ${esc(w.text)}
          <div class="meta">${fmtDate(w.ts)}</div></div>
      </div>`).join("") : empty("No wins recorded yet.")}`;

    // B3 · Graduation candidates (overdue strategies/playbooks → skills)
    renderGraduation();
    renderProposals();
    renderToggles();

    // B4 · Back-capture backlog (pending / oldest-age-vs-ceiling / drain rate)
    renderBacklog();

    // F5/#251 · Change ledger (spec, tier, gate verdicts, merge SHA per change)
    renderLedger();

    // D · Latest session
    const last = M[M.length - 1];
    const ls = last.signals || {};
    const sc = last.contribution_score || 0;
    elLatest.innerHTML = `
      <span class="lbl">Latest session · ${fmtDate(last.ts)}</span>
      <div class="score" style="color:${scoreColor(sc)}">${sc}<span style="font-size:14px;color:var(--text-tertiary)">/100</span></div>
      <div class="pills">
        ${(last.helped || []).map(h => `<span class="pill pos">✓ ${esc(h)}</span>`).join("")}
        ${(last.shortfalls || []).map(h => `<span class="pill neg">▲ ${esc(h)}</span>`).join("")}
        ${ls.struggles ? `<span class="pill neg">✕ ${ls.struggles} struggle(s)</span>` : ""}
      </div>
      <div class="kv">${ls.tool_calls || 0} tool calls ·
        ${(ls.skills_invoked || []).length} skill(s) ·
        ${fmtTok((ls.tokens || {}).output)} out tok ·
        directive ${ls.directive_present ? "present" : "absent"}</div>`;

    // C · Asset usefulness
    const assets = aggregateAssets(M);
    const maxUsed = Math.max(1, ...assets.map(a => a.used));
    elAssets.innerHTML = `<span class="lbl">Asset usefulness</span>` + (assets.length ? assets.map(a =>
      `<div class="bar ${a.used === 0 ? "muted" : ""}">
        <span class="name">${esc(a.asset)}</span>
        <span class="track"><span class="fill" style="width:${Math.round(a.used / maxUsed * 100)}%"></span></span>
        <span>${a.used}/${a.seen}</span>
      </div>`).join("") : empty("No asset usage yet."));
  }

  // ---- wiki nav (left): grouped + collapsible (Topics / Concepts) over window.WIKI;
  // links open the build-rendered .html in a new tab.
  // Shape: {topics:[{topic,synthesis,sources[]}],concepts:[{name,synthesis,sources[]}]}
  // — concepts are symmetric with topics (synthesis page + co-located sources). (see build.py).
  (function renderWiki() {
    const W = window.WIKI || { topics: [], concepts: [] };
    const elList = document.getElementById("wiki-list");
    const elCount = document.getElementById("wiki-count");
    const elSearch = document.getElementById("wiki-search");
    if (!elList) return;

    // Flatten to leaves with a precomputed lowercase haystack for search.
    // Since #234 the build emits `groups` — one per knowledge variant the content
    // layer declares — so a layer using notes/ or kb/ gets a nav instead of a blank
    // panel. `topics`/`concepts` remain as aliases, and are the fallback for a
    // metrics.js built before that change.
    const groups = (W.groups && W.groups.length)
      ? W.groups
      : [{ label: "Topics", entries: W.topics || [] },
         { label: "Concepts", entries: W.concepts || [] }];
    const groupLabels = groups.map(g => g.label);
    const leaves = [];
    groups.forEach(g => {
      (g.entries || []).forEach(e => {
        const topic = e.topic || e.name;
        if (e.synthesis) leaves.push({ ...e.synthesis, group: g.label, topic, isSynthesis: true });
        (e.sources || []).forEach(s => leaves.push({ ...s, group: g.label, topic, isSynthesis: false }));
      });
    });
    leaves.forEach(l => {
      l._hay = [l.name, l.kind, l.layer, l.topic, l.dir, l.excerpt, (l.sources || []).join(" ")]
        .filter(Boolean).join(" ").toLowerCase();
    });
    const total = leaves.length;

    function leafHTML(l) {
      const meta = (l.topic && !l.isSynthesis)
        ? esc(l.topic) + (l.version ? " · " + esc(l.version) : "")
        : esc(fmtDate(l.last_updated));
      // Overlay badge: which content layer this page came from ("personal", or a
      // team overlay's dir basename). Absent on a metrics.js built before the
      // field existed — render nothing rather than "undefined".
      const layer = l.layer
        ? `<span class="wl" title="Content layer: ${esc(l.layer)}">${esc(l.layer)}</span>`
        : "";
      // A page a higher-precedence layer also defines: still listed under its own
      // layer (so provenance stays visible) but dimmed and marked as overridden.
      const sh = l.shadowed
        ? `<span class="wsh" title="Overridden by a higher-precedence layer">overridden</span>`
        : "";
      return `<a class="wikiitem${l.shadowed ? " shadowed" : ""}" href="${esc(l.html)}" target="_blank" rel="noopener" title="${esc(l.name)}">
        <span class="wn"><span>${esc(l.name)}</span>${sh}<span class="wk">${esc(l.kind || "")}</span>${layer}</span>
        ${l.excerpt ? `<div class="wx">${esc(l.excerpt)}</div>` : ""}
        <div class="wd">${meta}</div></a>`;
    }

    function topicGroupHTML(items, topicsOpen, title, groupOpen = true) {
      // group leaves by topic; within a topic, nest sources by their `dir` path
      // (mirrors the content dir tree). Synthesis first, then the nested tree.
      // A flat topic (every source dir === "") renders as a flat list — no
      // sub-groups — so flat and nested layouts both work.
      const byTopic = {};
      items.forEach(l => { (byTopic[l.topic] = byTopic[l.topic] || []).push(l); });
      const topics = Object.keys(byTopic).sort();
      if (!topics.length) return "";
      const ot = topicsOpen ? " open" : "";
      function tree(srcs) {
        const root = { dirs: {}, leaves: [] };
        srcs.forEach(s => {
          let node = root;
          (s.dir || "").split("/").filter(Boolean).forEach(seg => {
            node.dirs[seg] = node.dirs[seg] || { dirs: {}, leaves: [] };
            node = node.dirs[seg];
          });
          node.leaves.push(s);
        });
        return root;
      }
      function count(n) { let c = n.leaves.length; Object.keys(n.dirs).forEach(d => c += count(n.dirs[d])); return c; }
      function renderNode(n) {
        // child groups (anything with children) float to the top; leaves below
        let h = "";
        Object.keys(n.dirs).sort().forEach(d => {
          h += `<details class="wikitopic"${ot}><summary>${esc(d)}/ <span>${count(n.dirs[d])}</span></summary>
            <div class="wikinest">${renderNode(n.dirs[d])}</div></details>`;
        });
        h += n.leaves.map(leafHTML).join("");
        return h;
      }
      const inner = topics.map(t => {
        const ls = byTopic[t];
        const synth = ls.filter(l => l.isSynthesis).map(leafHTML).join("");
        const body = synth + renderNode(tree(ls.filter(l => !l.isSynthesis)));
        return `<details class="wikitopic"${ot}><summary>${esc(t)} <span>${ls.length}</span></summary>
          <div class="wikinest">${body}</div></details>`;
      }).join("");
      return `<details class="wikigroup"${groupOpen ? " open" : ""}><summary><span>${esc(title)}</span><span>${items.length}</span></summary>
        <div class="wikinest">${inner}</div></details>`;
    }

    function draw(items, expandAll) {
      elCount.textContent = total ? `${items.length} of ${total} page(s)` : "";
      if (!total) { elList.innerHTML = empty("No wiki pages yet."); return; }
      if (!items.length) { elList.innerHTML = empty("No matches."); return; }
      // One section per declared knowledge variant (#234), in build order. On load
      // layer rows open and their groups stay collapsed. Search sets expandAll,
      // which opens every level that holds a match.
      const groupOrder = groupLabels;
      const groups = ls => groupOrder.map(label =>
        topicGroupHTML(ls.filter(l => l.group === label), expandAll, label, expandAll)).join("");
      // Multi-layer: one collapsible section per content layer, precedence order.
      // A single layer renders without a layer wrapper (#142).
      const layers = W.layers || [];
      elList.classList.toggle("split", layers.length > 1);
      if (layers.length > 1) {
        elList.innerHTML = layers.map(lab => {
          const mine = items.filter(l => l.layer === lab);
          if (!mine.length) return "";
          const open = true;  // layers open, groups below follow expandAll
          return `<details class="wikilayer"${open ? " open" : ""}>
            <summary><span>${esc(lab)}</span><span>${mine.length}</span></summary>
            <div class="wikinest">${groups(mine)}</div></details>`;
        }).join("");
        return;
      }
      elList.innerHTML = groups(items);
    }

    function filter() {
      const q = (elSearch.value || "").trim().toLowerCase();
      // searching expands topics + concepts so matches are visible
      draw(q ? leaves.filter(l => l._hay.includes(q)) : leaves, !!q);
    }

    if (elSearch) elSearch.addEventListener("input", filter);
    // Open a page in the overlay viewer. The nav never navigates, so its scroll
    // and open groups stay put. A modified click still opens a new tab.
    elList.addEventListener("click", e => {
      const a = e.target.closest("a.wikiitem");
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
      e.preventDefault();
      openViewer(a.getAttribute("href"), { title: a.getAttribute("title") || "Wiki" });
    });
    // default: layers open, groups collapsed
    draw(leaves, false);
  })();
</script>
</body>
</html>
